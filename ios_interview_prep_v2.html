}`},{id:`ar9`,level:`Intermediate`,q:`MV vs MVVM vs TCA in SwiftUI?`,short:`MV: views bind to @Observable models/stores. MVVM: per-screen view models. TCA: reducer, state, actions, effects.`,a:`With @Observable, a model or store that owns state and exposes intent methods can be bound directly by views (MV); a ViewModel that only forwards calls 1:1 adds nothing. MVVM still helps when a screen needs formatting or a state machine testable without views. TCA (Point-Free) centralizes state in a pure reducer with explicit actions and effects — very testable and predictable, at the cost of a dependency and boilerplate. Choose by team size, testing needs and complexity.`,code:null},{id:`ar10`,level:`Advanced`,q:`What is the dependency rule in Clean Architecture?`,short:`Dependencies point inward: UI → use cases → entities. Inner layers define protocols; outer layers (network, DB) implement them.`,a:`Code is layered from entities (business rules) and use cases in the center to presentation, networking and persistence on the outside. Source dependencies only point inward: a use case depends on a Repository protocol it defines, and the outer data layer implements it. All the wiring happens in one composition root, typically the app target. The payoff is testable, framework-independent business logic; the cost is more types and indirection, so scale it to the app's size.`,code:null},{id:`ar11`,level:`Advanced`,q:`How do you modularize an iOS app with Swift packages?`,short:`Feature modules depend on shared core modules, not on each other; split interface from implementation; wire it in the app target.`,a:`Split the app into local Swift packages: core modules (networking, design system, models) and feature modules that depend only on core. Features don't import each other; cross-feature navigation goes through interface modules or a router injected by the app target. Benefits: faster incremental builds, boundaries enforced by access control, parallel team work, and features testable in isolation. Watch linking: many dynamic frameworks slow launch, so prefer static linking.`,code:null}],Networking:[{id:`nw1`,level:`Basic`,q:`Steps to make a network request with URLSession?`,short:`Create URL → URLRequest → URLSession.data → decode → handle errors → dispatch to main thread.`,a:`1. Build the URL — preferably with URLComponents and URLQueryItems, so query parameters are percent-encoded correctly.
2. Build a URLRequest — HTTP method, headers (Content-Type, Accept, Authorization), body (JSONEncoder for JSON), timeoutInterval, and cachePolicy if needed.
3. Send it — try await session.data(for: request) (iOS 15+), or the older dataTask(with:completionHandler:) plus resume(). Use an injected or configured URLSession, not always .shared.
4. Validate the response — cast to HTTPURLResponse and check statusCode (2xx success; 401 → refresh token or log out; 4xx client error; 5xx server error). URLSession does not throw for HTTP error codes, only for transport failures (URLError: no connection, timeout, cancelled).
5. Decode the Data with a configured JSONDecoder, and map DecodingErrors to useful app errors.
6. Update the UI on the main actor — @MainActor view models make this automatic; with completion handlers, hop to DispatchQueue.main.
7. Handle cancellation — task cancellation cancels the request in async code; keep the URLSessionDataTask to cancel it with callbacks.

Production extras: retries with backoff for transient errors (Q129), logging, and a protocol-based client so it can be tested (Q132).`,code:`func fetchUsers(page: Int) async throws -> [User] {
  var components = URLComponents(string: "https://api.example.com/users")!
  components.queryItems = [URLQueryItem(name: "page", value: "\\(page)")]

  var request = URLRequest(url: components.url!)
  request.httpMethod = "GET"
  request.setValue("application/json", forHTTPHeaderField: "Accept")

  let (data, response) = try await URLSession.shared.data(for: request)
  guard let http = response as? HTTPURLResponse else { throw APIError.invalidResponse }
  guard (200..<300).contains(http.statusCode) else { throw APIError.status(http.statusCode) }
  return try JSONDecoder().decode([User].self, from: data)
}`},{id:`nw3`,level:`Intermediate`,q:`What are URLSession session types?`,short:`Shared: singleton. Default: disk-caching, configurable. Ephemeral: in-memory only. Background: transfers while suspended.`,a:`URLSession behavior comes from its URLSessionConfiguration:

• URLSession.shared — a ready-made singleton using a default configuration. Fine for simple requests, but you can't change its configuration, set a delegate (for auth challenges, metrics, progress) or use it for background transfers.
• .default — the standard configuration: persistent disk cache (URLCache), cookies and credentials stored in the shared stores. Create your own session from it to customize timeouts, headers, cache, waitsForConnectivity, allowsExpensiveNetworkAccess/allowsConstrainedNetworkAccess (cellular/Low Data Mode), and a delegate.
• .ephemeral — like default but keeps cache, cookies and credentials in memory only; everything is discarded when the session is invalidated. Good for private browsing, sensitive flows, or tests that must not share state.
• .background(withIdentifier:) — hands upload/download tasks to a system daemon so they continue while the app is suspended or even terminated by the system (Q131). Delegate-based, file-based uploads only.

Practical advice: create one long-lived session per configuration and reuse it — sessions are expensive and own a connection pool; a session with a delegate keeps a strong reference to it until you call invalidateAndCancel() or finishTasksAndInvalidate(). Set httpMaximumConnectionsPerHost to limit parallel requests to one host.`,code:`let config = URLSessionConfiguration.default
config.timeoutIntervalForRequest = 20
config.waitsForConnectivity = true                 // wait instead of failing offline
config.allowsConstrainedNetworkAccess = false      // respect Low Data Mode
config.httpAdditionalHeaders = ["Accept": "application/json"]
let apiSession = URLSession(configuration: config)

let privateSession = URLSession(configuration: .ephemeral)`},{id:`nw4`,level:`Advanced`,q:`What is SSL Pinning?`,short:`Hardcodes expected server certificate in the app. Prevents MITM attacks even with rogue certificate authorities.`,a:`Normally iOS trusts a server's TLS certificate if it chains to any root CA in the device's trust store. Pinning adds a check: the app only accepts the connection if the server's certificate — or, better, its public key — matches one the app expects. This blocks man-in-the-middle attacks even when an attacker can get a certificate trusted by the device: a compromised or mis-issuing CA, a corporate proxy, or a user-installed profile (which is how Charles and Proxyman decrypt traffic).

Ways to implement it:

• Info.plist (iOS 14+): NSAppTransportSecurity → NSPinnedDomains with NSPinnedLeafIdentities or NSPinnedCAIdentities (base64 SHA-256 of the SubjectPublicKeyInfo) — declarative, no code, works for URLSession and WebKit loads that use ATS.
• URLSessionDelegate urlSession(_:didReceive:completionHandler:): evaluate the SecTrust normally first, then compare the server key's hash with your pins.
• Libraries: TrustKit, Alamofire's ServerTrustManager.

Operational risks — these are what interviewers want to hear:

• Pin the public key (SPKI), not the whole certificate, so routine renewals with the same key don't break the app.
• Always ship a backup pin (next key or intermediate CA); if the server rotates keys and all pins mismatch, every installed version stops working until users update.
• Coordinate with the backend team, and consider a remote kill switch.
• Pinning makes debugging with proxies harder — disable it in debug builds only.
• It's not a defense against a compromised device; attackers with a jailbreak can bypass it.`,code:`// URLSessionDelegate public-key pinning (simplified)
func urlSession(_ session: URLSession, didReceive challenge: URLAuthenticationChallenge,
                completionHandler: @escaping (URLSession.AuthChallengeDisposition, URLCredential?) -> Void) {
  guard let trust = challenge.protectionSpace.serverTrust,
        SecTrustEvaluateWithError(trust, nil),                    // normal validation first
        let chain = SecTrustCopyCertificateChain(trust) as? [SecCertificate],
        let key = chain.first.flatMap(SecCertificateCopyKey),
        let keyData = SecKeyCopyExternalRepresentation(key, nil) as Data?,
        pinnedKeyHashes.contains(sha256Base64(keyData)) else {   // real SPKI pins also hash the ASN.1 key header
    return completionHandler(.cancelAuthenticationChallenge, nil)
  }
  completionHandler(.useCredential, URLCredential(trust: trust))
}`},{id:`nw5`,level:`Intermediate`,q:`What are Proxyman and Charles used for?`,short:`HTTP/HTTPS proxy tools that intercept app network traffic. Debug requests, inspect payloads, mock responses.`,a:`Charles Proxy and Proxyman are HTTP(S) debugging proxies for macOS. You route the Simulator's or a device's traffic through them (the Mac's proxy settings for the Simulator; Wi-Fi proxy settings for a device) and they show every request and response the app makes.

To read HTTPS traffic, you install and trust the tool's root certificate on the Simulator/device; the proxy then performs a deliberate man-in-the-middle, decrypting and re-encrypting traffic. (Apps with certificate pinning reject this — which is why pinning is usually disabled in debug builds.)

What you use them for:

• Inspect requests and responses: URLs, headers, auth tokens, bodies, status codes, timing — to verify what the app actually sends vs what the backend expects.
• Breakpoints: pause a request or response and edit it before it continues — test how the UI handles a 500, an empty list, or a malformed field.
• Map Local / Map Remote: serve a local JSON file instead of the real response, or redirect to staging — great when the backend isn't ready.
• Throttling: simulate slow 3G or high latency (Apple's Network Link Conditioner does this system-wide too).
• Repeat / compose requests, and export them as cURL for backend teammates.

Alternatives: Xcode's network report in Instruments (HTTP Traffic instrument), and logging URLSessionTaskMetrics.`,code:null},{id:`nw6`,level:`Advanced`,q:`How do you handle 401s and token refresh with concurrent requests?`,short:`Funnel refresh through an actor holding a single in-flight refresh Task; other requests await it, then retry once.`,a:`When several requests get a 401 at once, each must not start its own refresh — that wastes calls and can invalidate the refresh token. Put the refresh behind an actor that stores the in-flight Task; later callers await the same task. After a successful refresh, retry the original request once; if refresh fails, log the user out. Proactively refreshing shortly before expiry avoids many 401s.`,code:`actor TokenRefresher {
  private var task: Task<String, Error>?
  func refreshedToken() async throws -> String {
    if let task { return try await task.value }
    let t = Task { try await api.refreshToken() }
    task = t
    defer { task = nil }
    return try await t.value
  }
}`},{id:`nw7`,level:`Intermediate`,q:`How should a client retry failed requests?`,short:`Retry only idempotent requests and transient errors (timeouts, 5xx, 429), with exponential backoff plus jitter and a cap.`,a:`Retrying blindly can duplicate side effects (charging a card twice) and hammer a struggling server (a thundering herd that keeps it down). A good retry policy:

1. Retry only idempotent requests — GET, PUT, DELETE, or a POST that carries an idempotency key the server uses to dedupe.
2. Retry only transient failures — timeouts (URLError.timedOut), lost connections (.networkConnectionLost, .notConnectedToInternet after connectivity returns), HTTP 5xx, and 429 Too Many Requests. Never retry 4xx client errors like 400, 401 (refresh the token instead — Q128), 403 or 404, or decoding errors.
3. Exponential backoff — wait 1 s, 2 s, 4 s… between attempts, so load on the server drops off.
4. Jitter — add randomness to each delay so thousands of clients don't retry in sync.
5. Respect Retry-After on 429/503 when the server sends it.
6. Cap the number of attempts and the total time, and stop on cancellation.

For offline scenarios, URLSessionConfiguration.waitsForConnectivity lets a request wait for the network instead of failing immediately, and user-initiated retries (a "Try again" button) often beat silent automatic ones.`,code:`func sendWithRetry(_ request: URLRequest, maxAttempts: Int = 3) async throws -> Data {
  var attempt = 0
  while true {
    do {
      return try await send(request)
    } catch let error where isTransient(error) && attempt < maxAttempts - 1 {
      let delay = pow(2, Double(attempt)) + .random(in: 0...0.5)  // backoff + jitter
      try await Task.sleep(for: .seconds(delay))                  // throws if cancelled
      attempt += 1
    }
  }
}`},{id:`nw9`,level:`Intermediate`,q:`How does HTTP caching work with URLSession?`,short:`URLCache stores responses per Cache-Control; with ETag/Last-Modified it revalidates and reuses the body on 304 Not Modified.`,a:`URLSession checks a URLCache before going to the network. With the default request cache policy .useProtocolCachePolicy, it follows standard HTTP caching rules from the server's response headers:

• Cache-Control: max-age=N / Expires — the response is fresh for N seconds and served straight from cache, with no request at all. no-store prevents caching; no-cache means "store, but revalidate every time"; private is fine for a single-user client cache.
• When a cached response is stale and has validators — an ETag or Last-Modified header — URLSession sends a conditional request with If-None-Match / If-Modified-Since. If nothing changed, the server replies 304 Not Modified with no body, and URLSession returns the cached body to you as a 200 — your code doesn't see the difference, but bandwidth is saved.

Other request policies: .reloadIgnoringLocalCacheData (always network), .returnCacheDataElseLoad (offline-first, ignores freshness), .returnCacheDataDontLoad (cache only).

Practical notes: the default URLCache.shared is small, so set your own capacities early in launch (or per session via configuration.urlCache); responses larger than about 5% of the disk capacity aren't cached; only cacheable methods (GET) are cached; and an HTTP cache is not a substitute for an app database when you need offline data or queries.`,code:`URLCache.shared = URLCache(memoryCapacity: 20 * 1024 * 1024,
                           diskCapacity: 200 * 1024 * 1024)

var request = URLRequest(url: url)
request.cachePolicy = .useProtocolCachePolicy          // honor Cache-Control / ETag

var offline = URLRequest(url: url)
offline.cachePolicy = .returnCacheDataElseLoad         // show cached data when possible`},{id:`nw11`,level:`Intermediate`,q:`How do background URLSession transfers behave?`,short:`Run in a system daemon and continue while suspended or after the system kills the app — but are cancelled if the user force-quits.`,a:`Create the session with URLSessionConfiguration.background(withIdentifier:). The system then performs the transfers in a separate process, so they continue while your app is suspended and even if the system terminates it.

How it behaves:

• Only download tasks and upload tasks from a file are supported (no upload from Data, no data tasks), and you get results through delegate callbacks, not completion handlers or async/await results.
• When transfers finish while the app isn't running, iOS relaunches the app in the background and calls application(_:handleEventsForBackgroundURLSession:completionHandler:). Recreate the session with the same identifier, let the delegate handle events, and call the stored completion handler from urlSessionDidFinishEvents(forBackgroundURLSession:) so the system can take an updated snapshot and suspend you again.
• In urlSession(_:downloadTask:didFinishDownloadingTo:), move the file immediately — the temporary file is deleted when the method returns.
• If the user force-quits the app from the app switcher, the system cancels all the session's background transfers and won't relaunch the app automatically; the user must open it again.
• isDiscretionary = true lets the system wait for good conditions (Wi-Fi, power) — recommended for large transfers; background transfers from a backgrounded app may be scheduled discretionarily anyway.
• sessionSendsLaunchEvents controls whether completion wakes the app.`,code:null},{id:`nw12`,level:`Intermediate`,q:`How do you make a network layer testable?`,short:`Depend on a small transport protocol that URLSession conforms to, and inject a stub that returns fixture data.`,a:`The goal is to test request building, decoding and error handling without hitting the real network — fast, deterministic, offline tests.

Approach 1 — protocol seam: depend on a tiny protocol with the one method you use. URLSession already has data(for:), so it conforms with an empty extension. Production code injects URLSession; tests inject a stub that returns fixture data and a chosen status code, or throws URLError(.notConnectedToInternet). A spy variant also records the URLRequest it received so you can assert on the URL, method, headers and body.

Approach 2 — URLProtocol subclass: register a custom protocol on an ephemeral URLSessionConfiguration (protocolClasses = [MockURLProtocol.self]); it intercepts every request and returns canned responses. This tests the real URLSession path (including your configuration) without changing production types.

What to test: decoding against fixture JSON files copied from real responses; error mapping for 401, 404, 500 and malformed JSON; request construction (path, query items, auth header); retry and token-refresh logic. Keep a small number of separate integration tests against a staging server for contract drift.`,code:`protocol HTTPTransport: Sendable {
  func data(for request: URLRequest) async throws -> (Data, URLResponse)
}
extension URLSession: HTTPTransport {}            // already has data(for:)

final class SpyTransport: HTTPTransport, @unchecked Sendable {
  var lastRequest: URLRequest?
  let body: Data, status: Int
  init(body: Data, status: Int = 200) { self.body = body; self.status = status }

  func data(for request: URLRequest) async throws -> (Data, URLResponse) {
    lastRequest = request
    let response = HTTPURLResponse(url: request.url!, statusCode: status, httpVersion: nil, headerFields: nil)!
    return (body, response)
  }
}

@Test func mapsUnauthorized() async {
  let api = APIClient(transport: SpyTransport(body: Data(), status: 401))
  await #expect(throws: APIError.unauthorized) { try await api.profile() }
}`}],Persistence:[{id:`fw2`,level:`Intermediate`,q:`What is Core Data? What are its key concepts?`,short:`Object-graph persistence framework. NSManagedObject, NSManagedObjectContext, NSPersistentStoreCoordinator.`,a:`Core Data is Apple's object-graph management and persistence framework — not a database itself, but a layer that manages model objects, their relationships and changes, and saves them to a store (usually SQLite; also in-memory or binary).

Key pieces:

• Managed object model (.xcdatamodeld) — entities, attributes, relationships, delete rules (nullify, cascade, deny).
• NSManagedObject — instances of entities (your model objects).
• NSManagedObjectContext — an in-memory scratchpad: you fetch, create, modify and delete objects in it, and nothing is persisted until you call save(). It tracks changes, supports undo, and is bound to one queue (Q138).
• NSPersistentStoreCoordinator — connects contexts to the persistent store(s).
• NSPersistentContainer — sets the whole stack up in a few lines (viewContext for the UI, newBackgroundContext() for work). NSPersistentCloudKitContainer adds iCloud sync.
• NSFetchRequest — queries with NSPredicate, sort descriptors, batch sizes, fetch limits.
• NSFetchedResultsController — drives table/collection views and reports changes.

Features to mention: faulting (objects are loaded lazily, so large graphs stay cheap), lightweight and staged migrations between model versions, batch insert/update/delete that bypass the context for performance, and persistent history tracking for syncing changes between processes (app + extensions). SwiftData (Q134) is built on top of it.`,code:`let container = NSPersistentContainer(name: "Model")
container.loadPersistentStores { _, error in
  if let error { fatalError("Store failed: \\(error)") }
}
let context = container.viewContext
context.automaticallyMergesChangesFromParent = true

let request = NSFetchRequest<Item>(entityName: "Item")
request.predicate = NSPredicate(format: "isDone == NO")
request.sortDescriptors = [NSSortDescriptor(keyPath: \\Item.createdAt, ascending: false)]
let items = try context.fetch(request)`},{id:`fw3`,level:`Intermediate`,q:`Difference between SwiftData and Core Data?`,short:`SwiftData (iOS 17+): @Model classes, Swift-native, built on Core Data's store. Core Data: mature, every iOS version.`,a:`SwiftData (iOS 17+) is a Swift-first persistence framework that uses Core Data's storage underneath. Models are plain classes marked @Model; a ModelContainer holds the schema and store, and a ModelContext tracks changes (the main context autosaves by default). In SwiftUI, @Query fetches and observes results automatically. Core Data (available since iOS 3) is more mature: fetched results controllers, fine-grained migrations, batch operations, NSPersistentCloudKitContainer. Choose SwiftData for new iOS 17+ apps with simple schemas; Core Data for older deployment targets or advanced needs.`,code:`@Model final class Item {
  var name: String
  var date: Date
  init(name: String, date: Date = .now) { self.name = name; self.date = date }
}
// In a view: @Query(sort: \\Item.date) var items: [Item]`},{id:`fw5`,level:`Basic`,q:`What is UserDefaults and what should it NOT be used for?`,short:`Key-value plist store for small preferences. Not for sensitive data, large objects, or relational data.`,a:`UserDefaults is a simple key-value store for small values: Bool, Int, Double, String, Date, Data, URL, and arrays/dictionaries of those (property-list types). It's persisted to a plist in the app's container and loaded into memory when the app starts. Calling synchronize() is unnecessary today.

Good uses: user preferences (theme, sort order), feature flags, onboarding-completed and "last opened tab" state, small caches of IDs. In SwiftUI, @AppStorage("key") reads and writes it reactively; use UserDefaults(suiteName: "group.…") to share values with extensions via an App Group.

What not to use it for:

• Secrets — tokens, passwords, keys, PII. It's an unencrypted plist, readable from device backups and on jailbroken devices. Use the Keychain (Q137).
• Large data — images, big JSON, files. It's loaded into memory and rewritten as a whole, which slows launch and wastes memory. Use the file system.
• Structured or relational data that you query, sort or update incrementally — use SwiftData, Core Data or SQLite.
• Data that must not be lost — it's not transactional.

Also: UserDefaults is one of Apple's required-reason APIs, so your privacy manifest must declare why you use it (Q164). Storing Codable types as encoded Data is fine for small values.`,code:`UserDefaults.standard.set(true, forKey: "hasSeenOnboarding")
let seen = UserDefaults.standard.bool(forKey: "hasSeenOnboarding")

struct SettingsView: View {
  @AppStorage("sortOrder") private var sortOrder = "date"   // reactive
  var body: some View {
    Picker("Sort", selection: $sortOrder) { Text("Date").tag("date"); Text("Name").tag("name") }
  }
}`},{id:`ps1`,level:`Basic`,q:`How do you choose where to persist data on iOS?`,short:`UserDefaults: small prefs. Keychain: secrets. Files: blobs and caches. SwiftData/Core Data/SQLite: queryable structured data.`,a:`UserDefaults for small settings and flags. Keychain for tokens, passwords and keys. The file system for images, JSON and large blobs — Documents for user-created data, Application Support for app data, Caches for anything re-downloadable (the system may purge it). A database — SwiftData, Core Data, or SQLite via a library like GRDB — for structured, queryable, relational data. CloudKit or your own backend when data must sync across devices.`,code:null},{id:`ps2`,level:`Intermediate`,q:`Where and how should you store an auth token?`,short:`Keychain with a deliberate accessibility class, e.g. AfterFirstUnlockThisDeviceOnly — never UserDefaults or a plist.`,a:`Store tokens in the Keychain and choose the accessibility class on purpose: kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly lets background refreshes read it after the first unlock and keeps it out of backups restored to other devices; WhenUnlockedThisDeviceOnly is stricter. Keep the access token in memory while running, refresh it with a refresh token, and delete Keychain items on logout. UserDefaults is an unencrypted plist in the app container, readable from backups and on jailbroken devices.`,code:`let query: [String: Any] = [
  kSecClass as String: kSecClassGenericPassword,
  kSecAttrAccount as String: "authToken",
  kSecValueData as String: Data(token.utf8),
  kSecAttrAccessible as String: kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly
]
let status = SecItemAdd(query as CFDictionary, nil)`},{id:`ps3`,level:`Advanced`,q:`What are the threading rules for Core Data?`,short:`Each context is confined to its queue: use perform. Managed objects aren't thread-safe — pass NSManagedObjectID between contexts.`,a:`Every NSManagedObjectContext is bound to a queue: viewContext to the main queue, background contexts to private queues. All access to a context and its objects must happen inside perform { } (or on main for viewContext). Pass NSManagedObjectID values across contexts and re-fetch with existingObject(with:). Do heavy imports on newBackgroundContext() and set viewContext.automaticallyMergesChangesFromParent = true. The launch argument -com.apple.CoreData.ConcurrencyDebug 1 catches violations.`,code:`let bg = container.newBackgroundContext()
try await bg.perform {
  let item = Item(context: bg)
  item.name = "Imported"
  try bg.save()
}`},{id:`ps4`,level:`Advanced`,q:`What is @ModelActor in SwiftData?`,short:`Macro generating an actor with its own ModelContext, so SwiftData work runs off the main actor safely.`,a:`SwiftData's ModelContext is not Sendable, and model objects (@Model instances) belong to the context that fetched them — you can't pass them between threads or actors. Doing heavy work (importing thousands of records, large queries) on the main context blocks the UI.

@ModelActor (iOS 17) is a macro you apply to an actor. It generates:

• a modelContainer property and an init(modelContainer:),
• a modelExecutor and a modelContext created from the container and bound to the actor's own serial executor,

so everything inside the actor uses its own context safely, off the main actor.

How to use it:

• Create it with the shared ModelContainer (Importer(modelContainer: container)); the container is Sendable.
• Do inserts, fetches and saves inside actor methods, and call try modelContext.save() — the main context will see the changes once saved (SwiftUI's @Query updates automatically).
• Pass PersistentIdentifier values (which are Sendable) across the boundary instead of model objects, then re-fetch with modelContext.model(for:) or self[id, as: Item.self] on the other side.

This mirrors Core Data's rule of using background contexts and passing NSManagedObjectIDs (Q138).`,code:`@ModelActor
actor Importer {
  func importItems(_ names: [String]) throws -> [PersistentIdentifier] {
    let items = names.map { Item(name: $0) }
    items.forEach { modelContext.insert($0) }
    try modelContext.save()
    return items.map(\\.persistentModelID)        // Sendable IDs, not models
  }
}

let importer = Importer(modelContainer: container)
let ids = try await importer.importItems(names)`},{id:`ps5`,level:`Advanced`,q:`How do you design offline-first data with sync?`,short:`Local DB is the source of truth; queue writes in an outbox; pull with change tokens; resolve conflicts; tombstone deletes.`,a:`The UI reads only from the local database, so it works offline and updates reactively. User edits are written locally and appended to an outbox that a sync engine flushes when connectivity returns, with retries and idempotency keys. Pull changes since a server-provided change token or cursor. Resolve conflicts with an explicit policy — last-writer-wins on server timestamps, field-level merge, or asking the user. Represent deletes as tombstones so they propagate instead of records reappearing.`,code:null}],Testing:[{id:`te1`,level:`Basic`,q:`Difference between unit testing and UI testing?`,short:`Unit: components in isolation with mocks, fast. UI testing: drives the full app like a user (XCUITest), slow.`,a:`Unit tests check one unit — a function, view model, parser or service — in isolation, with dependencies replaced by test doubles. They run in-process in milliseconds, need no UI, are deterministic, and pinpoint exactly what broke. Written with XCTest or Swift Testing.

UI tests (XCUITest) launch the real app in a separate process and drive it like a user — taps, typing, swipes — finding elements through the accessibility tree. They verify full flows (login → home → checkout) including navigation, layout and integration between components. They're slow (seconds per test), more flaky (timing, animations, network), and failures say "something in this flow broke" rather than where.

In between sit integration tests (several real components together, e.g. repository + in-memory database) and snapshot tests (Q145).

How to balance them — the testing pyramid: many unit tests, fewer integration tests, a handful of UI tests for the critical user journeys. Make UI tests reliable by stubbing the network via launch arguments/environment, disabling animations, using stable accessibility identifiers, and waiting for elements instead of sleeping.`,code:null},{id:`te2`,level:`Intermediate`,q:`What is TDD (Test-Driven Development)?`,short:`Write failing test first, then minimal code to pass, then refactor. Red-Green-Refactor cycle.`,a:`Test-Driven Development is a workflow where tests drive the design, in short cycles:

1. Red — write a small test for the next behavior you need; run it and watch it fail (proving the test can fail and the behavior doesn't exist yet).
2. Green — write the simplest code that makes it pass — even naive code.
3. Refactor — clean up the implementation and tests (naming, duplication, structure) while all tests stay green.

Then repeat with the next behavior.

Why teams use it: you design the API from the caller's point of view, code ends up testable by construction (injected dependencies, small units), you get a regression suite as a by-product, and bugs are caught minutes after they're written. A bug fix in TDD starts with a failing test that reproduces the bug.

Where it fits in iOS: excellent for view models, formatters, parsers, validation, business rules and networking layers; less natural for exploratory UI layout, where snapshot or UI tests come later.

Honest trade-offs: it feels slower at first, it requires discipline, and tests tied to implementation details make refactoring painful — test behavior, not private steps.`,code:`// 1. Red: the behavior doesn't exist yet
@Test func rejectsShortPasswords() {
  #expect(PasswordValidator().validate("abc") == .tooShort)
}

// 2. Green: simplest implementation
struct PasswordValidator {
  enum Result: Equatable { case ok, tooShort }
  func validate(_ s: String) -> Result { s.count < 8 ? .tooShort : .ok }
}
// 3. Refactor, then write the next failing test (e.g. requires a digit)`},{id:`te3`,level:`Intermediate`,q:`What is mocking? What types of test doubles exist?`,short:`Replacing real dependencies with controlled test objects. Types: stub, mock, fake, spy.`,a:`Mocking replaces real dependencies with controlled test doubles. Types: Stub (returns predetermined values), Mock (also verifies specific calls were made), Fake (a simplified working implementation like an in-memory DB), Spy (records calls for later assertions). In Swift, depend on protocols and inject a test conformer. Neither XCTest nor Swift Testing generates mocks — write them by hand or use a macro/codegen library.`,code:`protocol APIService { func fetchUser() async throws -> User }
class MockAPI: APIService {
  var result: User = .preview
  func fetchUser() async throws -> User { result }
}`},{id:`te4`,level:`Basic`,q:`What is XCUITest?`,short:`Apple's UI testing framework. Drives the full app. Finds elements via accessibility identifiers.`,a:`XCUITest is Apple's UI testing framework, part of XCTest. A UI test target runs in a separate process from your app: it launches the app with XCUIApplication, then interacts with it only through the accessibility hierarchy — it can't call your code or read your objects directly (black-box testing).

Core API:

• XCUIApplication() — launch(), launchArguments, launchEnvironment (use these to point the app at mock data, reset state, disable animations).
• Queries — app.buttons["Login"], app.textFields["email"], app.cells.element(boundBy: 0), .staticTexts, .navigationBars, matched by accessibility identifier or label.
• Actions — tap(), typeText(_:), swipeUp(), press(forDuration:).
• Waiting — waitForExistence(timeout:) or XCTNSPredicateExpectation, never sleep().
• Handling system alerts with addUIInterruptionMonitor; screenshots and XCTAttachment for failures; Xcode's UI test recording to generate a first draft.

Best practices: set stable accessibilityIdentifiers (not localized text), make tests independent and order-free, stub the backend, wrap screens in the Page Object pattern so selectors live in one place, and keep the suite small. It also powers performAccessibilityAudit() (Xcode 15) and launch-time measurement with XCTApplicationLaunchMetric. Note: Swift Testing doesn't support UI tests — they remain XCTest.`,code:`final class LoginUITests: XCTestCase {
  func testLoginShowsWelcome() {
    let app = XCUIApplication()
    app.launchArguments = ["-uiTesting", "-mockNetwork"]
    app.launch()

    let login = LoginScreen(app: app)           // page object
    login.email.tap(); login.email.typeText("a@b.com")
    login.password.tap(); login.password.typeText("secret123")
    login.submit.tap()

    XCTAssertTrue(app.staticTexts["welcomeTitle"].waitForExistence(timeout: 5))
  }
}`},{id:`te5`,level:`Advanced`,q:`What is snapshot testing?`,short:`Records a rendered view as reference image. Future runs compare pixel-for-pixel. Fails on visual regressions.`,a:`Snapshot testing renders a view or view controller, saves the result as a reference (usually a PNG image; text formats like a view-hierarchy dump also exist), and on later runs re-renders and compares against that reference. Any visual difference — spacing, color, font, truncation, a missing element — fails the test, and the tool writes the failed and diff images for review.

Libraries: SnapshotTesting (Point-Free) — supports many strategies (.image, .recursiveDescription, .dump, JSON) for UIKit and SwiftUI; iOSSnapshotTestCase (originally Facebook's FBSnapshotTestCase, now maintained by Uber).

Workflow: run once in record mode to create references, commit them, and re-record deliberately when a design change is intended — reviewers then see image diffs in the pull request.

Strengths: catches visual regressions unit tests can't see, and covers many states cheaply — light/dark mode, Dynamic Type sizes (including accessibility sizes), right-to-left languages, small and large devices, loading/empty/error states.

Drawbacks: references depend on the simulator model, OS version and rendering, so CI must use the same environment; tiny anti-aliasing differences need a tolerance (precision/perceptualPrecision); image files bloat the repository; and tests can be "blindly re-recorded", hiding real bugs.`,code:`import SnapshotTesting
import XCTest

final class ProfileCardSnapshotTests: XCTestCase {
  func testProfileCard() {
    let view = ProfileCard(user: .fixture).frame(width: 375)
    assertSnapshot(of: view, as: .image(layout: .sizeThatFits,
                                        traits: .init(userInterfaceStyle: .dark)))
  }
}`},{id:`te6`,level:`Intermediate`,q:`Swift Testing vs XCTest — key differences?`,short:`@Test functions, #expect (records, continues) and #require (throws, stops), parameterized arguments, traits, parallel by default.`,a:`Swift Testing (import Testing, shipped with Xcode 16 / Swift 6, open source) is Apple's modern unit-testing library. Main differences from XCTest:

• Declaring tests: any function marked @Test (global, or inside a struct, actor or class), with an optional display name. No test prefix or XCTestCase subclass. Each test gets a fresh instance of its suite, so init/deinit replace setUp/tearDown.
• Assertions: one macro, #expect(expression), replaces the 40+ XCTAssert... functions and shows the values of sub-expressions on failure. #expect records the failure and continues; try #require(...) throws and stops the test — and also unwraps optionals (let user = try #require(optionalUser)). Errors: #expect(throws: MyError.self) { ... }.
• Parameterized tests: @Test(arguments: [...]) runs the test once per input (or over zipped collections), each reported separately.
• Traits: .tags(...), .disabled("reason"), .enabled(if:), .timeLimit(...), .bug("url"), .serialized.
• Parallel by default, including in-process parallelism across tests — so tests must not share mutable state; use .serialized where needed.
• Async: tests can be async; use confirmation() to verify events happen (instead of XCTestExpectation). Exit tests check code that crashes (#expect(processExitsWith:)).
• Swift 6.3 added Issue.record(..., severity: .warning) (report without failing) and try Test.cancel() to cancel a running test.

XCTest is still needed for UI tests (XCUITest) and performance tests (measure). Both frameworks can live in the same target, so migrate gradually.`,code:`import Testing

@Suite("Parsing") struct ParserTests {
  let parser = Parser()                         // fresh instance per test

  @Test("Parses valid input", arguments: ["1", "42", "007"])
  func parses(_ input: String) throws {
    let n = try #require(parser.number(input))  // unwrap or stop
    #expect(n > 0)
  }

  @Test(.tags(.critical)) func rejectsEmpty() {
    #expect(throws: ParseError.empty) { try parser.strictNumber("") }
  }
}`},{id:`te8`,level:`Intermediate`,q:`How do you unit test an async view model?`,short:`Inject protocol dependencies (stub API or repository), await the async method, then assert on the resulting state.`,a:`Make the view model depend on protocols and inject stubs that return fixtures or throw errors. Mark the test @MainActor if the view model is main-actor isolated, call the async method with await, and assert on the published state — loading, loaded, failed. Avoid sleeps: if work is fired off internally in an unstructured Task, expose it or make the method async so the test can await it.`,code:`@MainActor @Test func loadsUser() async {
  let vm = ProfileVM(api: StubAPI(user: .fixture))
  await vm.load()
  #expect(vm.state == .loaded(.fixture))
}`}],Performance:[{id:`pf1`,level:`Intermediate`,q:`Which Instruments template do you use for which problem?`,short:`Time Profiler: CPU. Hangs/Animation Hitches: jank. Allocations/Leaks: memory. Plus SwiftUI, Network and Energy templates.`,a:`Time Profiler samples call stacks to find CPU hot spots. Hangs and Animation Hitches show main-thread stalls and missed frames. Allocations tracks memory growth (Mark Generation shows what's left after repeating an action); Leaks finds unreachable cycles. The SwiftUI template shows body evaluations and their causes; Network and Energy cover traffic and battery. Always profile a Release build on a real device — Debug builds and the Simulator behave very differently.`,code:null},{id:`pf2`,level:`Intermediate`,q:`How do you measure and improve app launch time?`,short:`Measure with the App Launch template and MetricKit. Cut pre-main (dylibs, static init) and post-main work before first frame.`,a:`Launch has two phases:

• Pre-main (before main()): the dynamic linker loads and binds dynamic frameworks, the runtime registers Objective-C classes, and static initializers and +load methods run.
• Post-main: UIApplication and the app delegate are created, didFinishLaunching and scene connection run, the root view controller loads, and the first frame is rendered. Extended launch — loading real content — follows.

Apple's target (WWDC19 "Optimizing App Launch"): render the first frame within about 400 ms — roughly 100 ms of system work plus about 300 ms for your app — so the app is responsive by the end of the launch animation. The first frame can use placeholders for content that loads asynchronously.

How to improve:

• Fewer dynamic frameworks — merge them or link statically (Xcode 15's mergeable libraries help); avoid many CocoaPods dynamic frameworks.
• Remove +load and expensive static initializers; make singletons lazy.
• Defer non-essential work — analytics, ads, remote config, non-critical SDKs — until after the first frame, or do it lazily on first use.
• No synchronous I/O or network on the main thread at launch; don't block on a remote config fetch.
• Simplify the first screen — fewer views, no giant storyboards, cached data instead of waiting for the network.

Measure, don't guess: the App Launch template in Instruments, XCTApplicationLaunchMetric in performance tests, MetricKit and the Xcode Organizer launch-time metrics from real users. Test on a real device, Release build, after a reboot for cold launch numbers.`,code:null},{id:`pf3`,level:`Basic`,q:`What is the frame budget, and what causes a hitch?`,short:`60 Hz ≈ 16.7 ms per frame, 120 Hz ProMotion ≈ 8.3 ms. Main-thread work beyond that drops frames.`,a:`The display refreshes 60 times per second (120 on ProMotion), so each frame must be produced in about 16.7 ms (8.3 ms), and the render server needs part of that time. Layout, SwiftUI body evaluation, text measurement, image decoding and any synchronous work on the main thread all count. Missing the deadline causes a hitch — a visibly dropped frame. Move work off main, cache expensive results, and decode or downsample images in the background.`,code:null},{id:`pf4`,level:`Advanced`,q:`What is offscreen rendering and how do you avoid it?`,short:`The GPU must render a layer into a separate buffer first (shadows without shadowPath, masks, group opacity). Costs extra passes.`,a:`Some effects force the render server to draw a layer into an offscreen buffer before compositing: shadows without a shadowPath (the shape has to be derived from the content), mask layers, group opacity, and some corner-radius clipping of content. In scrolling lists this burns GPU time and causes hitches. Fixes: set layer.shadowPath explicitly, avoid masks where a simple cornerRadius works, pre-render rounded images, and use shouldRasterize only for static complex content. The Simulator's Color Off-screen Rendered option highlights offenders.`,code:`card.layer.shadowOpacity = 0.2
card.layer.shadowRadius = 8
card.layer.shadowPath = UIBezierPath(
  roundedRect: card.bounds, cornerRadius: 12).cgPath`},{id:`pf5`,level:`Intermediate`,q:`What is a jetsam event?`,short:`iOS terminates apps exceeding memory limits. No exception in your code — it looks like a silent crash. Reduce peak memory.`,a:`When memory runs low, iOS's jetsam mechanism terminates processes — background apps first, but a foreground app is killed if it exceeds its own memory limit. Your code gets no exception, so it often looks like a mysterious crash; check memory terminations in the Xcode Organizer, MetricKit, or JetsamEvent logs on the device. Reduce peak footprint: downsample images, use NSCache (evicts under memory pressure), respond to memory warnings, and stream large files instead of loading them fully.`,code:null},{id:`pf6`,level:`Intermediate`,q:`Why and how do you downsample images?`,short:`Decoded size = width × height × 4 bytes, regardless of file size. Decode at display size with ImageIO thumbnails.`,a:`A 4000×3000 photo decodes to about 48 MB of pixels even if the JPEG is 2 MB and the image view is 100 pt wide. Use ImageIO's CGImageSourceCreateThumbnailAtIndex with kCGImageSourceThumbnailMaxPixelSize set to display size × screen scale to decode only what you need, off the main thread — or UIImage.preparingThumbnail(of:) on iOS 15+. Cache the results in NSCache plus a disk cache.`,code:`let opts = [kCGImageSourceCreateThumbnailFromImageAlways: true,
            kCGImageSourceShouldCacheImmediately: true,
            kCGImageSourceCreateThumbnailWithTransform: true,
            kCGImageSourceThumbnailMaxPixelSize: maxPixels] as CFDictionary
guard let src = CGImageSourceCreateWithURL(url as CFURL, nil),
      let cg = CGImageSourceCreateThumbnailAtIndex(src, 0, opts) else { return nil }
return UIImage(cgImage: cg)`},{id:`pf7`,level:`Intermediate`,q:`How do you find out why a SwiftUI view keeps re-evaluating?`,short:`Call Self._printChanges() in body (debug only) and use the SwiftUI Instruments template to see what triggered updates.`,a:`let _ = Self._printChanges() inside body logs what caused each evaluation: @self (the view's inputs changed), @identity (the view was recreated), or a property name such as _model. SwiftUI compares a child view's stored inputs and skips its body when they are unchanged, so extra evaluations usually come from inputs that change every time — closures, freshly created objects, or broad ObservableObject publishes. Fixes: pass smaller values, adopt @Observable, keep heavy work out of body. _printChanges is an underscored API — debug builds only.`,code:`var body: some View {
  let _ = Self._printChanges()
  Text(model.title)
}`},{id:`pf8`,level:`Advanced`,q:`How do you monitor performance in production?`,short:`MetricKit delivers daily metrics and diagnostics (hangs, crashes, launch, memory); Xcode Organizer aggregates them.`,a:`An MXMetricManager subscriber receives MXMetricPayload about once a day (launch time, hang rate, memory, CPU, disk writes) and MXDiagnosticPayload with call stacks for crashes, hangs, CPU exceptions and disk-write exceptions (delivered immediately since iOS 15). The Xcode Organizer shows aggregated metrics from users who share analytics. Add signposts with OSSignposter around key operations to measure them in Instruments and in your own telemetry.`,code:null}],"Security & Tools":[{id:`st1`,level:`Basic`,q:`What is the Keychain? When should you use it over UserDefaults?`,short:`OS-managed encrypted storage for secrets: tokens, passwords, keys. Never store those in UserDefaults.`,a:`The Keychain is a secure, OS-managed encrypted store. Unlike UserDefaults (an unencrypted plist in the app container), items are encrypted with keys protected by the Secure Enclave and the device passcode, and access is controlled by accessibility classes. Items can be shared between your apps via Keychain Sharing. Items have historically survived app deletion, but Apple doesn't guarantee it — don't rely on it, and clear stale items on first launch if that matters. Use the Keychain for auth tokens, passwords, private keys and biometric-protected secrets.`,code:null},{id:`st2`,level:`Basic`,q:`What are the different iOS app states?`,short:`Not Running → Inactive → Active → Background → Suspended. Handle in AppDelegate or scenePhase.`,a:`iOS app (process) states:

• Not running — not launched, or terminated (by the user or the system).
• Inactive — in the foreground but not receiving events: briefly during launch and transitions, and while interrupted (incoming call sheet, Control Center pulled down, the app switcher).
• Active — foreground and receiving events: normal use.
• Background — not visible but executing code: for a short time after leaving the foreground (finish work with beginBackgroundTask), or longer for supported modes (audio, location, VoIP, background fetch/processing via BGTaskScheduler, background URLSession).
• Suspended — in memory but not executing. The system moves apps here automatically, and may terminate suspended apps without notice to reclaim memory — so save state when entering the background, not in applicationWillTerminate, which usually isn't called.

With the scene-based lifecycle, each scene has its own state (unattached, foreground inactive, foreground active, background) reported to its UISceneDelegate (sceneDidBecomeActive, sceneDidEnterBackground, …), while the process-level states still apply to the app as a whole. Apple's TN3187 says scene adoption becomes required for apps built with the SDK released after iOS 26 (Q40). In SwiftUI, observe @Environment(\\.scenePhase) (.active, .inactive, .background).`,code:`struct ContentView: View {
  @Environment(\\.scenePhase) private var phase
  var body: some View {
    MainView()
      .onChange(of: phase) { _, newPhase in
        if newPhase == .background { saveDraft() }   // may be suspended/killed soon
      }
  }
}`},{id:`st3`,level:`Intermediate`,q:`What is APNS and how does push notification delivery work?`,short:`Apple Push Notification service. App registers → gets device token → server sends payload to APNs → APNs delivers.`,a:`Flow: 1) The app calls registerForRemoteNotifications and receives a device token. 2) The app sends the token to your server. 3) Your server sends a JSON payload to APNs over HTTP/2, authenticating with a token (JWT signed by a .p8 key) or a certificate. 4) APNs delivers to the device. The payload's aps dictionary holds alert, badge and sound plus custom data. Background pushes (content-available: 1) can wake the app without showing anything, but delivery is throttled and not guaranteed.`,code:null},{id:`st4`,level:`Intermediate`,q:`Difference between URL Schemes and Universal Links?`,short:`URL Schemes: custom protocol, unverified, any app can intercept. Universal Links: HTTPS, domain-verified, secure.`,a:`URL Schemes (myapp://path) are custom protocol handlers registered in Info.plist. No ownership verification — any app can register the same scheme, creating a security risk. Universal Links use HTTPS URLs tied to your domain via an apple-app-site-association file (cryptographically verified by Apple). Deep links open the app if installed, fallback to Safari if not. Universal Links are preferred for security and better UX.`,code:null},{id:`st5`,level:`Intermediate`,q:`What is a symbolic breakpoint in Xcode?`,short:`Breakpoint on a method name regardless of file. Great for UIKit internals, ObjC exceptions, Auto Layout conflicts.`,a:`A symbolic breakpoint stops execution whenever a named function or method is called, no matter which file, module or framework implements it — including Apple's closed-source frameworks, where you can't set a line breakpoint. Add it from the Breakpoint navigator (+ → Symbolic Breakpoint), entering a symbol such as -[UIViewController viewDidLoad] or a Swift name like MyApp.ProfileViewModel.load, optionally limited to a module.

Useful symbols:

• UIViewAlertForUnsatisfiedConstraints — stop at Auto Layout conflicts and inspect the views involved.
• objc_exception_throw — stop where an Objective-C exception is thrown, before it unwinds (an Exception Breakpoint does this too).
• swift_willThrow — stop whenever any Swift error is thrown.
• -[UIView layoutSubviews] or -[UIViewController dealloc] — trace layout passes or deallocations.
• malloc_error_break — stop on heap corruption such as a double free.

Breakpoints can have conditions (self.isKindOfClass(...), a counter), an ignore count, and actions — log a message, run an LLDB command (po $arg1), play a sound — with "Automatically continue", turning them into non-intrusive logpoints without adding print statements. Share useful ones with the team by moving them to the User level or committing the shared breakpoint file.`,code:null},{id:`st7`,level:`Advanced`,q:`How do you protect an API key shipped in an app?`,short:`You can't fully — binaries and traffic can be inspected. Keep secrets on a backend proxy; use App Attest and short-lived tokens.`,a:`Anything in the app bundle can be extracted with reverse-engineering tools, and requests can be intercepted, so obfuscation only slows attackers down. Keep third-party secrets on your backend and have the app call your server, which adds the key. Authenticate users with short-lived tokens, use App Attest or DeviceCheck to verify requests come from a genuine app, and rate-limit on the server.`,code:null},{id:`st8`,level:`Intermediate`,q:`What are iOS data protection classes?`,short:`Files are encrypted with keys tied to the passcode; .complete is unreadable while locked, the default is until first unlock.`,a:`With a passcode set, file contents are encrypted with keys derived partly from it. Complete protection makes a file unreadable whenever the device is locked; completeUnlessOpen allows finishing writes to files already open; completeUntilFirstUserAuthentication (the default) is readable after the first unlock until reboot, which background tasks often need. Choose per file — stricter classes can break background access. Keychain items have equivalent accessibility classes.`,code:`try data.write(to: url, options: .completeFileProtection)`},{id:`st9`,level:`Advanced`,q:`How should Face ID / Touch ID protect sensitive data?`,short:`Store the secret in the Keychain with SecAccessControl (.biometryCurrentSet), not just a success boolean from LAContext.`,a:`LAContext.evaluatePolicy(...) returns a Boolean in your app's process. If your app does if success { showSecrets() }, an attacker on a jailbroken device can hook that call or flip the result, and the "protected" data was readable all along. Biometrics should gate access to a secret, not just a screen.

The secure pattern: store the secret (refresh token, encryption key, PIN-protected value) in the Keychain with an access-control object from SecAccessControlCreateWithFlags:

• .biometryCurrentSet — requires Face ID/Touch ID, and the item becomes unusable if biometric enrollment changes (a new face or finger added) — the strongest option.
• .biometryAny — survives enrollment changes.
• .userPresence — biometrics with passcode fallback.
• Combined with an accessibility class like kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly (the item is deleted if the passcode is removed, and never leaves the device).

When the app reads the item, the system shows the biometric prompt itself, and the Secure Enclave releases the item only after successful authentication — there's no boolean to bypass. For keys, you can go further and generate a Secure Enclave private key (kSecAttrTokenIDSecureEnclave) that never leaves the hardware and sign server challenges with it.

Also: add NSFaceIDUsageDescription to Info.plist (missing it crashes on Face ID devices), provide a fallback (passcode or re-login), and handle errors like biometryLockout and userCancel.`,code:`let access = SecAccessControlCreateWithFlags(nil,
  kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly,
  .biometryCurrentSet, nil)!

let add: [String: Any] = [
  kSecClass as String: kSecClassGenericPassword,
  kSecAttrAccount as String: "refreshToken",
  kSecValueData as String: Data(token.utf8),
  kSecAttrAccessControl as String: access
]
SecItemAdd(add as CFDictionary, nil)

// Reading triggers the system Face ID prompt; the Secure Enclave releases the data only on success.
let context = LAContext()
context.localizedReason = "Unlock your account"
let query: [String: Any] = [
  kSecClass as String: kSecClassGenericPassword,
  kSecAttrAccount as String: "refreshToken",
  kSecReturnData as String: true,
  kSecUseAuthenticationContext as String: context
]
var item: CFTypeRef?
let status = SecItemCopyMatching(query as CFDictionary, &item)`},{id:`st10`,level:`Intermediate`,q:`What is a privacy manifest?`,short:`PrivacyInfo.xcprivacy declares collected data, tracking domains and required-reason API usage; needed by apps and listed SDKs.`,a:`Since spring 2024, App Store submissions must declare approved reasons for 'required reason' APIs such as UserDefaults, file timestamps, system boot time and disk space, and commonly used third-party SDKs must ship their own manifests and signatures. The manifest also lists collected data types and tracking domains. Tracking across apps additionally requires App Tracking Transparency permission, and declared tracking domains are blocked until the user grants it.`,code:null},{id:`st11`,level:`Intermediate`,q:`How do you ship a risky feature safely?`,short:`Remote feature flag with a kill switch, 7-day phased release, monitoring of crashes and metrics, pause or disable if needed.`,a:`1. Feature flag with a kill switch — ship the code dark, behind a remotely controlled flag (Firebase Remote Config, LaunchDarkly, your own endpoint), so it can be turned off for everyone without a new binary or App Review. Keep the old code path working as the fallback.
2. Gradual exposure — enable the flag for internal users and TestFlight first, then a small percentage of production users, and increase as metrics stay healthy.
3. App Store phased release — for the binary itself, Apple spreads automatic updates over 7 days: 1%, 2%, 5%, 10%, 20%, 50%, 100%. You can pause for up to 30 days in total (any number of times) or release to everyone early. It only affects automatic updates — anyone can update manually from the App Store at any time, and new installs always get the new version.
4. Monitor — crash-free rate (Crashlytics, Xcode Organizer), MetricKit hang and launch metrics, error rates of the new endpoints, and business metrics for the flagged cohort, with alerts.
5. React — flip the flag off, pause the phased release, ship a fix with an expedited review if needed. You can't roll back an App Store binary, which is exactly why the flag matters.

Housekeeping: remove the flag and the old path once it's fully rolled out (stale flags become tech debt), and remember the version (CFBundleShortVersionString) is user-facing while the build number (CFBundleVersion) must increase with every upload. Server-driven changes need backward compatibility with old app versions still in the field.`,code:`struct FeatureFlags {
  let remote: RemoteConfig
  var newCheckout: Bool { remote.bool("new_checkout_enabled", default: false) } // safe default
}

func makeCheckout(flags: FeatureFlags) -> UIViewController {
  flags.newCheckout ? NewCheckoutViewController() : LegacyCheckoutViewController()
}`}],"System Design":[{id:`sd1`,level:`Basic`,q:`How do you structure an answer in a mobile system design interview?`,short:`Clarify scope, define API and data model, sketch client architecture, then deep-dive offline, caching, pagination and trade-offs.`,a:`1) Clarify functional requirements and scale and agree on scope. 2) Non-functional needs: offline, latency, battery, privacy. 3) Client–server API and data model. 4) High-level client architecture: UI, state, repository, network and persistence layers. 5) Deep dives: pagination, caching, sync, image loading, real-time updates. 6) Edge cases and failure modes. 7) Trade-offs, testing and monitoring. Explain why you choose each option rather than listing technologies.`,code:null},{id:`sd2`,level:`Intermediate`,q:`Design an infinite-scroll news feed.`,short:`Cursor pagination with prefetch, local cache as source of truth, image pipeline, optimistic likes with rollback.`,a:`Use cursor-based pagination (stable when new posts are inserted, unlike offsets) and prefetch the next page before the user reaches the end. Store pages in a local database that the UI observes, so the feed opens instantly and works offline. Load images through a pipeline with memory and disk caches, downsampling, and cancellation for off-screen cells. Make likes optimistic: update the UI immediately, send the request, roll back on failure. On refresh, show a 'new posts' pill instead of shifting the user's scroll position.`,code:null},{id:`sd3`,level:`Advanced`,q:`Design a chat app client.`,short:`Socket for live delivery, local DB + outbox, client message UUIDs for dedupe, server sequence numbers for ordering and gaps.`,a:`Use a WebSocket for live delivery while in the foreground and push notifications when not (a Notification Service Extension can decrypt or enrich content). Write outgoing messages to the local DB and an outbox first, show them as sending, then mark them sent on acknowledgement. A client-generated UUID makes resends idempotent so the server can dedupe retries. The server assigns a per-conversation sequence number used for ordering and gap detection — on reconnect, fetch everything after the last seen sequence. Discuss end-to-end encryption, read receipts and history pagination.`,code:null},{id:`sd5`,level:`Intermediate`,q:`Design an image loading and caching library.`,short:`Memory cache → disk cache → network; dedupe in-flight requests, downsample off main, cancel when cells are reused.`,a:`Look up a decoded image in a memory cache (NSCache keyed by URL and target size), then the original data in a size-limited disk cache with LRU or age eviction, then the network. Coalesce duplicate requests for the same URL into one in-flight task. Decode and downsample off the main thread to the display size. Support cancellation when a cell is reused, prioritize visible requests, and respect HTTP cache headers where possible.`,code:`actor ImageLoader {
  private var inFlight: [URL: Task<UIImage, Error>] = [:]
  func image(for url: URL) async throws -> UIImage {
    if let task = inFlight[url] { return try await task.value }
    let task = Task { try await download(url) }
    inFlight[url] = task
    defer { inFlight[url] = nil }
    return try await task.value
  }
}`}],Behavioral:[{id:`bh1`,level:`Basic`,q:`What is the STAR method?`,short:`Situation, Task, Action, Result — a concise story focused on your own actions and a measurable outcome.`,a:`STAR structures a behavioral answer into a short story with a clear outcome:

• Situation (10–15%) — just enough context: team, product, what was at stake. "Our banking app's checkout crash rate jumped right after a release."
• Task (10–15%) — what you were responsible for, and the constraint (deadline, ambiguity, conflict).
• Action (50–60%) — the specific steps you took and why: what you investigated, the options you weighed, who you involved, the technical decision. Say "I", not "we" — interviewers are evaluating you. This is where seniority shows.
• Result (15–20%) — the measurable outcome (for example: crash-free rate back above 99.5% within a day, build time cut by 40%, feature shipped two weeks early) and what you learned or would do differently.

Preparation: build a bank of 6–8 stories that cover common prompts — conflict/disagreement, failure or mistake, a production incident, leading without authority, ambiguity, a tight deadline, mentoring someone, a technical decision you're proud of. One good story can be adapted to several questions. Aim for about two minutes, have numbers ready, don't badmouth people, and expect follow-ups ("What would you do differently?", "How did the other person react?").`,code:null},{id:`bh2`,level:`Intermediate`,q:`Tell me about a technical disagreement with a teammate.`,short:`Show you listened first, used data or prototypes, disagreed respectfully, committed to the decision and kept the relationship.`,a:`Interviewers look for listening before arguing, separating the person from the idea, grounding the debate in evidence (benchmarks, prototypes, user impact), escalating only when needed, and committing once a decision is made even if it wasn't yours. Finish with the outcome and what you would repeat or change. Avoid stories where you were simply right and the other person simply wrong.`,code:null},{id:`bh3`,level:`Intermediate`,q:`Describe how you handled a production incident.`,short:`Mitigate first (flag off, rollback, pause rollout), communicate, then find root cause, fix, add tests and monitoring, blameless postmortem.`,a:`Interviewers want to see calm prioritization: stop the bleeding first, then find the root cause, then make sure it can't happen again, plus good communication. Structure the story (STAR):

1. Detection — how you found out: crash-rate alert in Crashlytics/Organizer, a spike in error logs, support tickets, an App Store review wave. Faster detection is itself a lesson.
2. Assess impact — which versions, devices, OS versions, what percentage of users, which feature; is data being lost or money affected? This sets urgency.
3. Mitigate — the fastest safe action: turn the feature flag off, pause the phased release, roll back a server change, add a server-side guard, or prepare an expedited App Review hotfix. Explain why you chose that option.
4. Communicate — keep stakeholders (product, support, backend) informed with regular, factual updates; give support a workaround message.
5. Root cause — reproduce it, use crash logs and symbolicated stack traces, logs and metrics; ask "why" until you reach the real cause (e.g. a backend field became null and the app force-unwrapped it).
6. Fix and prevent — fix with a regression test, then add safeguards: decoding that tolerates missing fields, contract tests with the backend, better monitoring/alerts, a release checklist item.
