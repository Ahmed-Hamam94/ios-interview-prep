ot:`#1A237E`,tag:`Patterns & Design`},Networking:{icon:`ti-cloud`,dot:`#006064`,tag:`Network & Errors`},Persistence:{icon:`ti-database`,dot:`#6D4C41`,tag:`Storage & Sync`},Testing:{icon:`ti-bug`,dot:`#558B2F`,tag:`Unit & UI Tests`},Performance:{icon:`ti-gauge`,dot:`#EF6C00`,tag:`Speed & Memory`},"Security & Tools":{icon:`ti-lock`,dot:`#4527A0`,tag:`Security & Xcode`},"System Design":{icon:`ti-sitemap`,dot:`#37474F`,tag:`Mobile Design Round`},Behavioral:{icon:`ti-message-circle`,dot:`#00838F`,tag:`STAR & Soft Skills`}},Pr={"Software Basics":[{id:`sb1`,level:`Basic`,q:`What is the difference between stack and heap memory?`,short:`Stack: fast LIFO call frames, freed at scope exit. Heap: dynamic, ARC-managed. Value types usually inline, not always.`,a:`The stack holds function call frames and local values — LIFO, very fast, freed automatically when the scope exits. The heap holds dynamically allocated memory such as class instances — slower to allocate and reference-counted by ARC. Value types (structs, enums) are usually stored inline on the stack or inside their container, but they end up on the heap when stored in a class property, captured by an escaping closure, boxed in a large existential, or held in an Array's buffer. Class instances always live on the heap.`,code:null},{id:`sb2`,level:`Basic`,q:`What does O(n²) time complexity mean?`,short:`Runtime quadruples when input doubles. Typical of nested loops. O(n) fix: use a Set.`,a:`Big O describes how runtime (or memory) grows as the input size *n* grows, ignoring constant factors and lower-order terms. Common classes, from best to worst:

• O(1) — constant: Dictionary/Set lookup (average case), array access by index.
• O(log n) — halves the problem each step: binary search on a sorted array.
• O(n) — one pass: contains on an Array, map, filter.
• O(n log n) — efficient comparison sorts such as Swift's sort().
• O(n²) — quadratic: doubling the input quadruples the work. 1,000 items ≈ 1 million comparisons; 10,000 items ≈ 100 million.

Quadratic code usually hides in nested loops over the same collection, in calling an O(n) method (contains, firstIndex(of:), removeFirst() on an Array) inside a loop, or in repeatedly inserting at the front of an Array. The usual fix trades memory for time: put elements in a Set/Dictionary (average O(1) lookups), or sort first and scan once. In an interview, also state the space complexity (the Set version uses O(n) extra memory) and mention best/average/worst case when they differ — e.g. hash lookups degrade to O(n) with many collisions.`,code:`// O(n²) — nested loop
func hasDuplicatesSlow(_ arr: [Int]) -> Bool {
  for i in 0..<arr.count {
    for j in (i + 1)..<arr.count where arr[i] == arr[j] {
      return true
    }
  }
  return false
}

// O(n) time, O(n) extra space — use a Set
func hasDuplicates(_ arr: [Int]) -> Bool {
  var seen = Set<Int>()
  for x in arr {
    if !seen.insert(x).inserted { return true }
  }
  return false
}`},{id:`sb4`,level:`Intermediate`,q:`Explain the SOLID principles with an iOS example for each.`,short:`Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion.`,a:`SOLID is five design principles that keep code easy to change and test. With an iOS example for each:

• S — Single Responsibility: a type should have one reason to change. A ProfileViewController that fetches JSON, parses it, caches it and formats dates has four. Split it into an APIClient, a ProfileRepository, a DateFormatter helper and a ViewModel; the VC only renders.
• O — Open/Closed: open for extension, closed for modification. Instead of a growing switch paymentType inside CheckoutService, define a PaymentMethod protocol; adding Apple Pay means adding a new conforming type, not editing existing code.
• L — Liskov Substitution: any subtype must work wherever its base type is expected, without surprises. A ReadOnlyCache subclass of Cache whose save() throws fatalError breaks LSP — callers of Cache can no longer trust save(). Model it as a separate protocol instead.
• I — Interface Segregation: many small protocols beat one fat one. UIKit itself splits UITableViewDataSource from UITableViewDelegate; in your code, prefer Readable and Writable storage protocols over one StorageProtocol with 15 methods, so mocks stay tiny.
• D — Dependency Inversion: high-level code depends on abstractions. The ViewModel depends on an AuthServicing protocol, and the app's composition root injects FirebaseAuthService (or a mock in tests).

Interview tip: don't just recite the acronym — pick one principle you actually applied and explain the before/after.`,code:`// Open/Closed + Dependency Inversion together
protocol PaymentMethod { func pay(_ amount: Decimal) async throws }
struct CardPayment: PaymentMethod { func pay(_ amount: Decimal) async throws { /* ... */ } }
struct ApplePayPayment: PaymentMethod { func pay(_ amount: Decimal) async throws { /* ... */ } }

final class CheckoutViewModel {
  private let payment: any PaymentMethod   // depends on the abstraction
  init(payment: any PaymentMethod) { self.payment = payment }
  func checkout(total: Decimal) async throws { try await payment.pay(total) }
}`},{id:`sb5`,level:`Intermediate`,q:`What is dependency injection? What problem does it solve?`,short:`Pass dependencies in from outside rather than creating them internally. Enables mocking and loose coupling.`,a:`Dependency injection means an object receives its collaborators instead of creating them (let api = APIClient() inside the type is the anti-example). It solves three problems:

1. Tight coupling — the type only knows a protocol, so you can swap implementations (staging vs production, Firebase vs REST).
2. Testability — tests inject mocks/stubs, making them fast, deterministic and offline.
3. Hidden dependencies — the initializer documents exactly what the type needs.

Forms: constructor injection (preferred — dependencies are non-optional and immutable), property injection (needed when you don't control init, e.g. storyboard-created view controllers), and method injection (pass a dependency to a single call). In SwiftUI, .environment(_:) is a form of DI for values shared down the view tree.

All the concrete wiring should live in one composition root (App/SceneDelegate or the App struct, or a coordinator). Containers such as Factory, Swinject or Resolver automate this, but plain initializer injection is enough for most apps. Avoid the *service locator* pattern (a global registry everyone pulls from) — it is DI in name only, because dependencies are hidden again.`,code:`protocol APIClient { func fetch() async throws -> Data }

final class ProfileViewModel {
  private let api: APIClient            // abstraction, not URLSession
  init(api: APIClient) { self.api = api }
}

// Composition root (production)
let vm = ProfileViewModel(api: LiveAPIClient(session: .shared))
// Test
let testVM = ProfileViewModel(api: StubAPIClient(data: fixture))`},{id:`sb6`,level:`Intermediate`,q:`What is a race condition? How do you prevent one?`,short:`Two threads access shared mutable state concurrently with a write. Outcome depends on timing.`,a:`A race condition happens when two or more threads access shared mutable state concurrently, at least one access is a write, and the outcome depends on the timing of the scheduler. Classic example: two threads run count += 1 — that is read, add, write — so both may read 5 and both write 6, losing an increment. Races cause crashes that are hard to reproduce (corrupted arrays/dictionaries, EXC_BAD_ACCESS) and silently wrong data.

Ways to prevent them:

• Actors (modern default): the compiler enforces that isolated state is touched by one task at a time.
• Serial DispatchQueue used as a synchronizer (queue.sync for reads/writes), or a concurrent queue with .barrier writes for a reader–writer pattern.
• Locks: NSLock, os_unfair_lock / OSAllocatedUnfairLock (iOS 16), or Mutex from the Synchronization framework (iOS 18). Keep critical sections tiny.
• Avoid sharing: use value types and immutable data, and pass copies between threads.

Detect them with Xcode's Thread Sanitizer (Scheme → Diagnostics) and, in Swift 6 language mode, the compiler's strict concurrency checking. Note that actors remove *data races*, but higher-level race conditions are still possible through actor reentrancy (see Q88 and Q95).`,code:`actor Counter {
  private var count = 0
  func increment() { count += 1 }   // serialized by the actor
  func value() -> Int { count }
}

// Lock-based alternative (iOS 16+)
import os
let total = OSAllocatedUnfairLock(initialState: 0)
total.withLock { $0 += 1 }`},{id:`sb7`,level:`Intermediate`,q:`What is the difference between REST and GraphQL?`,short:`REST: fixed resource endpoints. GraphQL: single endpoint, client declares exact data shape needed.`,a:`REST models the API as resources at fixed URLs (GET /users/1, GET /users/1/posts) and uses HTTP verbs and status codes for meaning. GraphQL exposes a single endpoint (usually POST /graphql) with a typed schema; the client sends a query describing exactly the fields it needs, and the server returns that shape.

Trade-offs worth naming:

• Over-/under-fetching: REST endpoints often return more than a screen needs, or force several round trips; GraphQL fetches a nested screen's data in one request with only the needed fields — valuable on slow mobile networks.
• Caching: REST gets HTTP caching (Cache-Control, ETag, CDNs) for free on GET requests. GraphQL usually goes over POST, so caching moves to the client — e.g. Apollo iOS's normalized cache.
• Versioning: REST commonly versions URLs (/v2/); GraphQL evolves the schema by adding fields and deprecating old ones.
• Tooling: GraphQL's schema enables code generation of type-safe Swift models (Apollo iOS codegen). REST can get similar benefits from OpenAPI generators (e.g. Apple's swift-openapi-generator).
• Server complexity: GraphQL needs protection against expensive nested queries and N+1 database problems; errors come back as HTTP 200 with an errors array, so the client must inspect the body.

REST is simpler and the industry default; GraphQL shines when many clients need different shapes of deeply related data.`,code:null},{id:`sb8`,level:`Advanced`,q:`What is a deadlock? Give an iOS-specific example.`,short:`Two threads each wait for a resource the other holds. iOS: DispatchQueue.main.sync called from the main thread.`,a:`A deadlock occurs when two threads each hold a resource the other needs, so both wait forever. Classic iOS example: calling DispatchQueue.main.sync from the main thread — the main queue waits for the block, which can never start because main is blocked. libdispatch detects this particular case and traps (crashes) instead of hanging silently; the same applies to sync onto any serial queue you are already running on. Fix: use async, or restructure so no queue waits on itself.`,code:`// Crashes: dispatch_sync on a queue already owned by this thread
DispatchQueue.main.sync {
  print("never runs")
}
// Fix: use .async instead`},{id:`sb9`,level:`Advanced`,q:`What is the difference between concurrency and parallelism?`,short:`Concurrency: structure for overlapping tasks. Parallelism: actually running tasks simultaneously on multiple cores.`,a:`Concurrency is about structure — designing a system to handle multiple tasks whose lifetimes overlap. Parallelism is about execution — actually running tasks at the same instant on multiple cores. You can have concurrency without parallelism (a single core time-slicing). Swift's async/await and actors express concurrent structure; the runtime's cooperative thread pool (about one thread per core) decides how much actually runs in parallel.`,code:null},{id:`sb10`,level:`Basic`,q:`What is polymorphism? Give a Swift example.`,short:`Objects of different types treated uniformly through a shared interface. Runtime selects correct behavior.`,a:`Polymorphism ("many forms") lets you treat values of different concrete types through one shared interface, and the right implementation is selected for the actual type. Swift supports several kinds:

• Subtype (inheritance) polymorphism: a UIView variable can hold a UILabel or UIButton; overridden methods like layoutSubviews() are chosen at runtime through the class vtable.
• Protocol polymorphism: any type conforming to Drawable can be used through any Drawable (dynamic dispatch via a witness table) or some Drawable / generics (resolved at compile time).
• Parametric polymorphism (generics): one implementation works for many types — Array<Element>, func max<T: Comparable>(...).
• Ad-hoc polymorphism (overloading): the same function name with different parameter types, chosen at compile time (print(_ x: Int) vs print(_ x: String)).

Benefits: calling code depends on behavior rather than concrete types, so new types can be added without changing callers (the Open/Closed principle), and tests can substitute fakes.`,code:`protocol Drawable { func draw() -> String }
struct Circle: Drawable { func draw() -> String { "○" } }
struct Square: Drawable { func draw() -> String { "□" } }

// Runtime (existential) polymorphism — heterogeneous array
let shapes: [any Drawable] = [Circle(), Square()]
shapes.forEach { print($0.draw()) }

// Compile-time (generic) polymorphism — specialized per type
func render<S: Drawable>(_ shape: S) -> String { shape.draw() }`},{id:`fw6`,level:`Basic`,q:`What is the Foundation framework?`,short:`Base framework beyond the standard library: Data, URL, Date, FileManager, URLSession, JSON coding, formatters, ObjC bridging.`,a:`Foundation provides the building blocks above the Swift standard library. The standard library itself supplies the core types — String, Array, Dictionary, Set, Int, Optional, Result. Foundation adds what most apps need on top:

• Data and values: Data, URL, Date, UUID, Decimal, Measurement, AttributedString.
• System services: FileManager, ProcessInfo, Bundle, UserDefaults, NotificationCenter, RunLoop, Timer.
• Networking: URLSession, URLRequest, URLCache.
• Coding and formatting: JSONEncoder/JSONDecoder, PropertyListEncoder, FormatStyle (date.formatted(...)), DateFormatter, NumberFormatter.
• Objective-C bridging: NSString, NSArray, NSNumber, toll-free bridging with Core Foundation.

Most iOS apps get it implicitly through import UIKit or import SwiftUI. Apple has rewritten much of it in Swift as the open-source swift-foundation package, which import Foundation uses on Linux and Windows since Swift 6 and which is aligned with the macOS 15 / iOS 18 implementation — so the same high-performance JSONDecoder, FormatStyle and Predicate behave the same across platforms.`,code:null}],"Objective-C":[{id:`oc1`,level:`Basic`,q:`What is a category in Objective-C? How does it differ from a subclass?`,short:`Adds methods to an existing class without subclassing. No stored properties. Swift extension equivalent.`,a:`A category adds methods to an existing class — even one you don't have the source for, like NSString or UIView — without subclassing. The methods become part of the class itself, so every instance (including ones created by frameworks) gets them. Categories can also add protocol conformance and split a large class's implementation across files.

Limitations: a category cannot add stored instance variables; it can declare properties, but you must implement them yourself, typically with associated objects (objc_setAssociatedObject). If a category method has the same name as an existing method (or another category's), which one wins is undefined — so prefix category methods (xyz_trimmed). A class extension (@interface MyClass ()) is an anonymous category declared in the .m file; unlike a category it *can* add ivars and is used for private properties.

A subclass instead creates a new type: it can add stored properties and override methods (calling super), but only instances of the subclass get the behavior. Swift extensions are the direct equivalent of categories: they can add methods, computed properties, initializers and protocol conformances, but not stored properties.`,code:`@interface NSString (XYZTrimming)
- (NSString *)xyz_trimmed;
@end

@implementation NSString (XYZTrimming)
- (NSString *)xyz_trimmed {
  return [self stringByTrimmingCharactersInSet:
    NSCharacterSet.whitespaceAndNewlineCharacterSet];
}
@end`},{id:`oc2`,level:`Intermediate`,q:`What are nil, Nil, NULL, and NSNull?`,short:`nil: ObjC object null. Nil: Class null. NULL: C pointer null. NSNull: object wrapping null for collections.`,a:`All four represent "nothing", but at different levels:

• nil — a null pointer to an Objective-C object (id, NSString *). Sending a message to nil is legal and does nothing, returning 0/NO/nil — a famous source of silent bugs.
• Nil — a null pointer to a Class (Class cls = Nil;), used e.g. when NSClassFromString finds no class.
• NULL — the C null pointer for non-object pointers (void *, int *, CGContextRef, NSError ).
• NSNull — a real singleton object ([NSNull null]) that represents null inside collections, because NSArray and NSDictionary cannot store nil (inserting nil crashes).

Where this matters in Swift: JSONSerialization turns JSON null into NSNull, so dict["key"] as? String returns nil for it — a reason to prefer Codable. Swift itself has only nil, which is Optional.none, and it works for every type, not just pointers.`,code:`id obj = nil;               // object pointer
Class cls = Nil;            // class pointer
void *ptr = NULL;           // C pointer
NSArray *a = @[[NSNull null], @"Hi"];   // null stored in a collection
[obj description];          // messaging nil: no crash, returns nil`},{id:`oc3`,level:`Basic`,q:`What is a block in Objective-C? How do you avoid retain cycles?`,short:`Anonymous closure capturing variables from enclosing scope. Use __weak + __strong to prevent cycles.`,a:`A block is Objective-C's closure: an anonymous function that captures variables from its enclosing scope. Key behaviors:

• Captured local variables are copied by value at the moment the block is created; to let the block modify a local, declare it __block.
• Captured objects are retained strongly. If self owns the block (stores it in a property) and the block references self — or an ivar, which implicitly means self->_ivar — you get a retain cycle.
• Blocks start on the stack and must be copied to the heap to outlive the scope; ARC does this for you when you assign them to strong variables, which is why block properties are declared copy.

The fix is the weak–strong dance: capture a weak reference outside, then promote it to a strong local inside so self can't be deallocated halfway through the block; bail out if it is already gone. Swift's equivalent is [weak self] plus guard let self else { return }.`,code:`__weak typeof(self) weakSelf = self;
self.completion = ^{
  __strong typeof(weakSelf) strongSelf = weakSelf;
  if (!strongSelf) return;      // self was deallocated
  [strongSelf doSomething];     // safe for the whole block
};

__block NSInteger counter = 0;  // block may modify it
void (^inc)(void) = ^{ counter++; };`},{id:`oc4`,level:`Intermediate`,q:`What are @synthesize and @dynamic?`,short:`@synthesize: auto-generates getter/setter (implicit since Xcode 4.4). @dynamic: runtime provides the impl (CoreData).`,a:`@synthesize tells the compiler to generate the getter, setter and backing instance variable for a @property. Since Xcode 4.4 (LLVM 4) this happens automatically, creating an ivar named _property, so you write it explicitly only when:

• you want a different ivar name (@synthesize name = myName;),
• you implement both the getter and setter yourself (or the getter of a readonly property) — auto-synthesis then stops, and you need @synthesize to get the ivar back,
• the property is declared in a protocol — properties from protocols are never auto-synthesized.

@dynamic promises the compiler that the accessors will exist at runtime, so it must not generate them and must not warn. Core Data's NSManagedObject subclasses use it because Core Data generates the accessors dynamically at runtime. It's also used when accessors are provided via resolveInstanceMethod: or by a superclass. If nothing provides them, calling the accessor crashes with "unrecognized selector".

The Swift equivalent of @dynamic for Core Data is @NSManaged.`,code:`@interface User : NSObject
@property (nonatomic, copy) NSString *name;
@end
@implementation User
@synthesize name = _userName;     // custom ivar name (rarely needed)
@end

@implementation Event            // NSManagedObject subclass
@dynamic timestamp;              // Core Data supplies accessors at runtime
@end`},{id:`oc5`,level:`Advanced`,q:`What is method swizzling? What are the risks?`,short:`Exchanges method implementations at runtime. Risks: load-order dependent, recursion bugs, breaks Swift dispatch.`,a:`Method swizzling exchanges the implementations (IMPs) of two methods at runtime using method_exchangeImplementations, so calls to the original selector run your code. Your replacement then calls "itself", which — after the swap — actually invokes the original implementation. Typical uses: automatic analytics for every viewDidAppear:, debugging tools, and patching third-party or system bugs.

Doing it correctly:

• Swizzle in +load (or an explicit setup call) once, guarded by dispatch_once.
• Use class_addMethod first, so you don't accidentally swizzle a superclass's implementation when the subclass doesn't override the method.
• Always call the original implementation unless you mean to replace it.

Risks: global behavior changes that are hard to debug, order dependence when multiple libraries swizzle the same method, infinite recursion if the call is wired wrong, breaking when Apple changes private behavior, and it only works with Objective-C dynamic dispatch — pure Swift methods are statically or vtable dispatched, so they can only be swizzled if marked @objc dynamic (or via Swift's @_dynamicReplacement, which is meant for development tooling). Prefer subclassing, delegation, composition or a public hook.`,code:`@implementation UIViewController (Tracking)
+ (void)load {
  static dispatch_once_t once;
  dispatch_once(&once, ^{
    Method original = class_getInstanceMethod(self, @selector(viewDidAppear:));
    Method swizzled = class_getInstanceMethod(self, @selector(trk_viewDidAppear:));
    method_exchangeImplementations(original, swizzled);
  });
}
- (void)trk_viewDidAppear:(BOOL)animated {
  [self trk_viewDidAppear:animated];   // calls the ORIGINAL after the swap
  NSLog(@"Appeared: %@", NSStringFromClass(self.class));
}
@end`},{id:`oc6`,level:`Intermediate`,q:`Difference between strong, weak, assign, and copy properties.`,short:`strong: owns. weak: non-owning, auto-nils. assign: primitives only. copy: copies on assignment.`,a:`These attributes describe ownership and memory semantics of an Objective-C property:

• strong (default for objects): the property owns the object and keeps it alive (retain count +1).
• weak: no ownership; ARC sets it to nil automatically when the object is deallocated. Used for delegates, data sources, IBOutlets to subviews, and back-references to parents to avoid retain cycles.

    get { value }
    set { value = min(max(range.lowerBound, newValue), range.upperBound) }

  var projectedValue: ClosedRange<Value> { range }   // exposed as $name

}`},{id:`uk4`,level:`Intermediate`,q:`How does UITableView cell reuse work? What bugs can it cause?`,short:`Off-screen cells recycled via reuseIdentifier queue. Stale state bug: always fully configure in cellForRowAt.`,a:`A table view only creates enough cells to fill the screen plus a few extra. When a cell scrolls off-screen it goes into a reuse queue keyed by its reuse identifier; dequeueReusableCell(withIdentifier:for:) hands back one of those recycled cells (or creates a new one if the queue is empty). This keeps memory flat and scrolling fast even with 10,000 rows.

    textLabel?.text = item.title
    accessoryType = item.isDone ? .checkmark : .none   // always set both cases
    imageTask = Task { [weak self] in
      let image = try? await loader.image(for: item.url)
      guard let self, self.itemID == item.id else { return }  // still the same row?
      self.imageView?.image = image

  override func prepareForReuse() {
    super.prepareForReuse()
    imageTask?.cancel()
    imageView?.image = nil
    textLabel?.text = nil
    accessoryType = .none
  }
}`},{id:`uk5`,level:`Intermediate`,q:`What is intrinsicContentSize?`,short:`View's natural size based on content. Auto Layout uses it to set size without explicit constraints.`,a:`intrinsicContentSize is the natural size a view wants based on its content, independent of constraints: a UILabel's size for its text and font, a UIButton's size for its title and insets, a UIImageView's image size, a UISwitch's fixed size. A plain UIView returns UIView.noIntrinsicMetric for both dimensions.

Auto Layout turns the intrinsic size into implicit constraints, so you only need to position such views (leading/top) and they size themselves. Two priorities control what happens when constraints push against that size:

• Content Hugging (default .defaultLow = 250 for views created in code; IB uses 251 for labels): resistance to growing larger than intrinsic size. Higher hugging = "keep me tight".
• Compression Resistance (default .defaultHigh = 750): resistance to shrinking smaller than intrinsic size. Higher = "don't truncate me".

Classic example: two labels side by side in a row — give the title lower compression resistance than the price so the title truncates first, and give the price higher hugging so the title takes the extra space.

For a custom view, override intrinsicContentSize and call invalidateIntrinsicContentSize() whenever the content changes so Auto Layout re-asks. Multi-line labels need preferredMaxLayoutWidth (or a width constraint) to compute their height.`,code:`final class Badge: UIView {
  private let label = UILabel()
  var text = "" {
    didSet {
      label.text = text
      invalidateIntrinsicContentSize()     // tell Auto Layout to re-measure
    }
  }
  override var intrinsicContentSize: CGSize {
    let s = label.intrinsicContentSize
    return CGSize(width: s.width + 24, height: s.height + 12)
  }
}

priceLabel.setContentHuggingPriority(.required, for: .horizontal)
titleLabel.setContentCompressionResistancePriority(.defaultLow, for: .horizontal)`},{id:`uk6`,level:`Advanced`,q:`What is the run loop and how does it affect UIKit?`,short:`Per-thread event loop. Heavy main-thread work starves it, causing dropped frames and hitches.`,a:`The run loop is a per-thread event loop that handles touches, timers and other input sources, then sleeps. UIKit's main run loop drives all UI: layout, drawing and event handling. Heavy synchronous work on the main thread starves it — no frames render and touches queue up, causing hitches and hangs. Move heavy work off the main actor (a nonisolated or @concurrent async function, or a background queue) and apply the result back on the main actor.`,code:`// Bad: heavy work blocks the main run loop
update(heavyProcess(bigList))
// Fix: run it off the main actor, update on main
Task {
  let result = await process(bigList) // @concurrent async func
  update(result)                      // back on the main actor
}`},{id:`uk7`,level:`Basic`,q:`What is Auto Layout? What is a constraint priority?`,short:`Constraint-based layout solved by Cassowary algorithm. Priority 1-1000: 1000=required, lower ones break first.`,a:`Auto Layout describes layout as constraints — linear equations between view attributes, e.g. button.leading = container.leading × 1.0 + 16 — instead of hard-coded frames. The engine (based on the Cassowary constraint-solving algorithm) solves all constraints together and produces frames that adapt to screen sizes, rotation, Dynamic Type and localization (right-to-left with leading/trailing).

Constraints must be:

• Sufficient — every view needs enough to determine x, y, width and height (intrinsic size can supply width/height). Otherwise layout is ambiguous.
• Consistent — if no solution satisfies all required constraints, they're unsatisfiable: UIKit logs "Unable to simultaneously satisfy constraints" and breaks one.

Priority is a value from 1 to 1000. 1000 (.required) must be satisfied; anything lower is optional — the engine satisfies it as closely as it can and drops lower priorities first when there's a conflict. Named values: .required (1000), .defaultHigh (750), .defaultLow (250), .fittingSizeLevel (50). A common pattern is an optional preferred size with a required maximum, so the layout degrades gracefully. Content hugging and compression resistance are priorities too.

Practical rules: set translatesAutoresizingMaskIntoConstraints = false on views you constrain in code, activate constraints in batches with NSLayoutConstraint.activate, prefer UIStackView for linear layouts, and debug with the view debugger or the UIViewAlertForUnsatisfiedConstraints symbolic breakpoint.`,code:`card.translatesAutoresizingMaskIntoConstraints = false
let preferredWidth = card.widthAnchor.constraint(equalToConstant: 400)
preferredWidth.priority = .defaultHigh          // optional: breaks first

NSLayoutConstraint.activate([
  card.centerXAnchor.constraint(equalTo: view.centerXAnchor),
  card.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 16),
  card.widthAnchor.constraint(lessThanOrEqualTo: view.widthAnchor, constant: -32), // required
  preferredWidth
])`},{id:`uk8`,level:`Advanced`,q:`When should you override drawRect(_:)?`,short:`Only for custom Core Graphics drawing that CALayer cannot achieve. Creates large backing bitmap — expensive.`,a:`Override draw(_:) only when you need custom Core Graphics drawing that can't be expressed with existing views or layer properties — charts, audio waveforms, signature pads, custom progress rings with complex paths.

Why it's expensive:

• UIKit allocates a backing bitmap for the view's layer: width × height × scale² × 4 bytes. A full-screen view on a 3× iPhone is several megabytes.
• Drawing runs on the CPU, on the main thread, every time the view is invalidated with setNeedsDisplay(), so frequent redraws cause hitches.
• An empty draw(_:) override still forces the bitmap to be allocated — never leave one in the code.

Rules: never call draw(_:) yourself — call setNeedsDisplay() (or setNeedsDisplay(_:) for a sub-rect) and UIKit draws on the next update cycle; draw only within the rect you're given when possible; set contentMode = .redraw if the drawing depends on size.

Prefer cheaper alternatives: layer properties (cornerRadius, borderWidth, shadowPath), CAShapeLayer for paths (GPU-rendered and animatable via strokeEnd), CAGradientLayer, image assets or SF Symbols, or UIGraphicsImageRenderer to render once into an image and reuse it.`,code:`final class Ring: UIView {
  var progress: CGFloat = 0 { didSet { setNeedsDisplay() } }   // never call draw()

  override func draw(_ rect: CGRect) {
    let path = UIBezierPath(arcCenter: CGPoint(x: bounds.midX, y: bounds.midY),
                            radius: bounds.width / 2 - 4,
                            startAngle: -.pi / 2,
                            endAngle: -.pi / 2 + 2 * .pi * progress,
                            clockwise: true)
    path.lineWidth = 6
    UIColor.systemBlue.setStroke()
    path.stroke()
  }
}
// Cheaper: a CAShapeLayer with the full circle path, animating \`strokeEnd\`.`},{id:`uk9`,level:`Basic`,q:`AppDelegate vs SceneDelegate?`,short:`AppDelegate: process-level events (launch, push registration). SceneDelegate (iOS 13+): each window's UI lifecycle.`,a:`Since iOS 13 an app's UI is organized into scenes — one per window, so on iPad (and in Stage Manager) an app can show several instances side by side. Responsibilities split in two:

• UIApplicationDelegate handles process-level events: didFinishLaunchingWithOptions (configure SDKs, services), push-notification registration and token callbacks, background URL session events, and choosing a scene configuration (application(_:configurationForConnecting:options:)). It also gets didDiscardSceneSessions when the user closes scenes.
• UIWindowSceneDelegate handles each scene's UI lifecycle: scene(_:willConnectTo:options:) (create the UIWindow and root view controller; handle deep links passed at launch), sceneDidBecomeActive, sceneWillResignActive, sceneWillEnterForeground, sceneDidEnterBackground, plus scene(_:openURLContexts:) and scene(_:continue:) for URLs and Universal Links while running.

Once an app adopts scenes, the app-level foreground/background callbacks (applicationDidBecomeActive, etc.) are no longer called — state that is per-window belongs in the scene delegate. SwiftUI hides this behind App, WindowGroup and @Environment(\\.scenePhase), with @UIApplicationDelegateAdaptor when you still need an app delegate.

Current status: since iOS 18.4 UIKit logs a warning for apps without the scene lifecycle, and Apple's TN3187 states that in the major release after iOS 26, apps built with the latest SDK must adopt the scene-based lifecycle or they won't launch. Supporting multiple windows stays optional — only adopting scenes is required.`,code:`final class SceneDelegate: UIResponder, UIWindowSceneDelegate {
  var window: UIWindow?

  func scene(_ scene: UIScene, willConnectTo session: UISceneSession,
             options: UIScene.ConnectionOptions) {
    guard let windowScene = scene as? UIWindowScene else { return }
    window = UIWindow(windowScene: windowScene)
    window?.rootViewController = RootViewController()
    window?.makeKeyAndVisible()
    if let url = options.urlContexts.first?.url { handleDeepLink(url) }
  }

  func sceneDidEnterBackground(_ scene: UIScene) { saveDraft() }
}`},{id:`uk10`,level:`Intermediate`,q:`setNeedsLayout vs layoutIfNeeded?`,short:`setNeedsLayout: mark dirty, layout on the next update cycle. layoutIfNeeded: apply pending layout now — used to animate constraints.`,a:`UIKit batches layout work into an update cycle that runs once per run loop pass, so many changes cost one layout pass.

• setNeedsLayout() marks the view's layout as dirty and returns immediately. On the next update cycle UIKit calls layoutSubviews(). Calling it ten times still results in one layout pass — cheap and asynchronous.
• layoutIfNeeded() forces any pending layout to happen right now, synchronously, for that view and its subviews. If nothing is dirty, it does nothing.
• layoutSubviews() is where layout actually happens — override it in custom views to position subviews, but never call it directly.

The classic use of layoutIfNeeded() is animating Auto Layout: change the constraint's constant (which marks layout dirty), then call layoutIfNeeded() on the common superview inside an animation block, so the frame changes happen inside the animation. Call it once before the block too if other layout changes are pending, so they don't get animated by accident.

Siblings to know: setNeedsUpdateConstraints() / updateConstraintsIfNeeded() for the constraints pass, and setNeedsDisplay() for redrawing content via draw(_:). Order in each cycle: update constraints → layout → display.`,code:`view.layoutIfNeeded()                    // flush pending layout first
heightConstraint.constant = expanded ? 300 : 120
UIView.animate(withDuration: 0.3) {
  self.view.layoutIfNeeded()             // frames change inside the animation
}`},{id:`uk11`,level:`Advanced`,q:`Why does a Timer stop firing while the user scrolls?`,short:`Scheduled timers use the .default run loop mode; scrolling runs the main run loop in .tracking. Add the timer to .common.`,a:`A run loop only services input sources and timers registered for its current mode. Timer.scheduledTimer(...) adds the timer to the current run loop in .default mode. While the user drags a scroll view (and while it decelerates), UIKit switches the main run loop to .tracking mode (UITrackingRunLoopMode) so scrolling isn't disturbed — and timers registered only in .default don't fire until scrolling stops. A countdown label or carousel then appears to freeze.

Fixes:

• Create the timer unscheduled and add it with RunLoop.main.add(timer, forMode: .common) — .common is a pseudo-mode that includes both default and tracking.
• In Combine, use Timer.publish(every:on: .main, in: .common).
• For per-frame visual updates, use CADisplayLink (added in .common mode), which syncs with the display refresh.
• In Swift concurrency, a Task loop with try await Task.sleep(for:) isn't tied to run loop modes.

Other timer facts worth mentioning: a scheduled Timer is retained by the run loop and the block-based API avoids the target retain cycle only if you capture [weak self]; call invalidate() when done; set tolerance (~10% of the interval) to let the system coalesce wakeups and save battery; timers aren't precise and don't fire while the app is suspended.`,code:`let timer = Timer(timeInterval: 1, repeats: true) { [weak self] _ in
  self?.tick()
}
timer.tolerance = 0.1
RunLoop.main.add(timer, forMode: .common)   // keeps firing during scrolling
// later: timer.invalidate()`},{id:`uk12`,level:`Intermediate`,q:`What is a diffable data source?`,short:`Snapshot-based data source keyed by Hashable identifiers; apply() diffs and animates changes without index-path bookkeeping.`,a:`UITableViewDiffableDataSource and UICollectionViewDiffableDataSource replace manual numberOfRows and performBatchUpdates. You build an NSDiffableDataSourceSnapshot of section and item identifiers and apply it; UIKit computes the diff and animates inserts, deletes and moves, eliminating 'invalid number of rows' crashes. Identifiers must be unique and stable — use model IDs rather than whole models — and call reconfigureItems (iOS 15) to refresh existing cells.`,code:`var snap = NSDiffableDataSourceSnapshot<Section, Item.ID>()
snap.appendSections([.main])
snap.appendItems(items.map(\\.id))
dataSource.apply(snap, animatingDifferences: true)`}],SwiftUI:[{id:`sui1`,level:`Basic`,q:`Difference between @State and @Binding?`,short:`@State: view owns the storage. @Binding: two-way reference to state owned elsewhere.`,a:`• @State declares a source of truth owned by the view. SwiftUI stores the value outside the view struct (in its attribute graph, tied to the view's identity), so it survives the struct being recreated on every body evaluation, and writing it re-renders the views that read it. Mark it private — it should be initialized and changed by the view itself. Use it for local UI state: is a sheet shown, text field contents, selected tab. Since iOS 17 it also owns @Observable model objects.
• @Binding is a two-way reference to a value owned somewhere else. It stores no data — just a getter and setter pointing at the source of truth. A child receives it with the $ prefix (Child(isOn: $isOn)), can read and write it, and the owner updates.

Rule of thumb: the view that creates and owns the data uses @State; a view that needs to modify data it doesn't own uses @Binding; a view that only reads it takes a plain let. You can derive bindings to sub-properties ($user.name), and for previews or fixed values use .constant(true). Don't use @State for data passed in from a parent — it only uses the initial value (see Q57).`,code:`struct Parent: View {
  @State private var isOn = false           // owns the truth
  var body: some View {
    VStack {
      Toggle("Switch", isOn: $isOn)
      Child(isOn: $isOn)                    // passes a binding
      Label(text: isOn ? "On" : "Off")      // read-only: plain value
    }
  }
}
struct Child: View {
  @Binding var isOn: Bool                   // can read and write
  var body: some View { Button("Flip") { isOn.toggle() } }
}
#Preview { Child(isOn: .constant(true)) }`},{id:`sui2`,level:`Intermediate`,q:`Difference between @StateObject and @ObservedObject?`,short:`@StateObject: view creates and owns it (stable lifetime). @ObservedObject: passed from outside, may change.`,a:`Both observe an ObservableObject and re-render the view when its objectWillChange publisher fires (e.g. a @Published property changes). The difference is ownership and lifetime:

• @StateObject — the view creates and owns the object. SwiftUI creates it once for the lifetime of the view's identity (the initializer is an autoclosure, evaluated only the first time) and keeps it alive while the view is in the hierarchy, even though the view struct is recreated many times.
• @ObservedObject — the view receives an object owned elsewhere. SwiftUI doesn't manage its lifetime; it just subscribes to it.

The classic bug: @ObservedObject var vm = HomeVM() in a child view. Every time the parent's body runs, the child struct is recreated, a new HomeVM is created, and state is lost (loading spinners restart, network requests repeat). Fix: @StateObject at the creation site, @ObservedObject (or @EnvironmentObject) further down.

Note that @StateObject only reads its initial argument once — passing a different id later won't create a new object; change the view's .id() to force that. For iOS 17+ with @Observable, the equivalents are @State (owned) and a plain property / @Bindable (received).`,code:`struct Root: View {
  @StateObject private var vm = HomeVM()   // created once, owned here
  var body: some View { HomeView(vm: vm) }
}

struct HomeView: View {
  @ObservedObject var vm: HomeVM           // passed in, not owned
  var body: some View { Text(vm.title) }
}
// ❌ @ObservedObject var vm = HomeVM()   — recreated on every parent update`},{id:`sui3`,level:`Intermediate`,q:`What is @Observable (iOS 17) vs ObservableObject?`,short:`@Observable: property-level tracking per view. ObservableObject: whole-object @Published fires on any change.`,a:`The Observation framework's @Observable macro (iOS 17+) replaces ObservableObject for most code:

• Granularity: with ObservableObject, *any* @Published change fires objectWillChange, and every view observing the object re-evaluates its body — even views that never read the changed property. @Observable tracks which properties each view's body actually reads during rendering, and invalidates only those views when those properties change.
• Less boilerplate: all stored properties are observable by default — no @Published. Opt a property out with @ObservationIgnored.
• Simpler property wrappers: owned instances use @State (not @StateObject), received ones are plain let/var properties, @Bindable creates bindings, and shared ones go through .environment(model) and @Environment(Model.self).
• Works beyond direct properties: tracking follows reads through arrays, nested observable objects and computed properties.

Things to watch: it only works on classes; @Observable objects are not Combine publishers, so code relying on $property.sink needs withObservationTracking or (iOS 26) the Observations async sequence; and @State var model = Model() runs the initializer on each view init (cheap objects only).

UIKit also supports it: on iOS 26, reading @Observable properties inside updateProperties(), layoutSubviews(), viewWillLayoutSubviews() or a cell's configurationUpdateHandler registers automatic observation, and UIKit re-runs the method when those properties change — no manual setNeedsLayout.`,code:`@Observable final class ProfileModel {
  var name = ""                      // tracked per property, no @Published
  var avatarURL: URL?
  @ObservationIgnored var cache: [String: Data] = [:]
}

struct ProfileView: View {
  @State private var model = ProfileModel()   // owner uses @State
  var body: some View {
    Text(model.name)    // only re-renders when \`name\` changes, not avatarURL
  }
}`},{id:`sui4`,level:`Advanced`,q:`What is view identity in SwiftUI?`,short:`Determines if SwiftUI updates or recreates a view. Structural: position in hierarchy. Explicit: .id() or Identifiable.`,a:`SwiftUI views are value-type descriptions that are recreated constantly; identity is how SwiftUI knows that "this Text now" is the same element as "that Text before". Identity determines lifetime: as long as identity stays the same, SwiftUI updates the existing view and keeps its @State, focus, scroll position and animations; when identity changes, the old view is destroyed (state reset, onDisappear) and a new one is created (onAppear, transitions).

Two kinds:

• Structural identity — the view's type and position in the view tree. The two branches of an if/else are different positions, so toggling the condition replaces one view with the other (and resets its state). Prefer a modifier with a conditional value (.opacity(isOn ? 1 : 0)) when you want the *same* view to change rather than be swapped.
• Explicit identity — given by ForEach IDs (Identifiable.id or id: \\.someKey) and by .id(value). Changing .id(...) deliberately resets a view — useful to restart a form or scroll position, harmful when done by accident.

Pitfalls: IDs must be stable and unique (no UUID() generated in body, no array indices for mutable lists), and AnyView erases type information, weakening structural identity and diffing.`,code:`if isOn { Text("A") } else { Text("B") }   // two identities: state resets
Text(isOn ? "A" : "B")                     // one identity: just updates

ForEach(items) { item in Row(item: item) } // identity = item.id (stable)
DetailView(user: user).id(user.id)         // new user → fresh state`},{id:`sui5`,level:`Advanced`,q:`What causes unnecessary SwiftUI redraws?`,short:`ObservableObject fires on any @Published change, AnyView, unstable identity, inline object creation in body.`,a:`A SwiftUI view's body re-evaluates when something it depends on changes. Re-evaluation is usually cheap, but unnecessary or heavy evaluations cause hitches in lists and animations. Common causes:

1. Broad ObservableObject publishing — every @Published change invalidates every view observing the object, even if it reads a different property. Fix: adopt @Observable (property-level tracking) or split the object.
2. Passing large models to children that need one field — the child's inputs "change" whenever the model does. Pass the specific values instead.
3. Inputs that are never equal — closures, freshly created objects, formatters or UUID()/Date() created inside body make the child's inputs differ on every pass, so SwiftUI can't skip it.
4. AnyView — erases types, so SwiftUI can't diff structurally and may rebuild subtrees.
5. Unstable identity — ForEach over indices or random IDs causes views to be recreated instead of updated.
6. State placed too high — a frequently changing value (a timer, scroll offset, text field) stored at the root re-evaluates the whole screen. Move it into the smallest subview that needs it.
7. Heavy work in body — sorting, filtering, date formatting. Precompute in the model.

Diagnose with Self._printChanges() and the SwiftUI template in Instruments (see Q154).`,code:`// ❌ Redraws when ANY published property of BigVM changes
struct Bad: View {
  @ObservedObject var vm: BigVM
  var body: some View { Text(vm.title) }
}

// ✅ Only depends on what it shows
struct Good: View {
  let title: String
  var body: some View { Text(title) }
}

// ✅ Keep fast-changing state local to a small view
struct Clock: View {
  @State private var now = Date.now
  var body: some View {
    Text(now, style: .time)
      .task { while !Task.isCancelled { try? await Task.sleep(for: .seconds(1)); now = .now } }
  }
}`},{id:`sui6`,level:`Intermediate`,q:`What is ViewBuilder?`,short:`Result builder transforming multiple View expressions in a closure into TupleView. Enables SwiftUI's DSL.`,a:`@ViewBuilder is a result builder (@resultBuilder) specialized for views. Inside a builder closure, every expression statement is collected and combined by static build... methods into a single return value, which is how you can list several views without commas or a return:

• multiple views → buildBlock → a TupleView<(A, B, C)>;
• if without else → buildIf → an optional view;
• if/else and switch → buildEither → _ConditionalContent<A, B> (both branches' types are preserved, which keeps structural identity);
• if #available → buildLimitedAvailability.

body is implicitly @ViewBuilder, as are the content closures of VStack, HStack, Group and so on. Apply it yourself to: custom container initializers that take content, functions or computed properties that return different views in different branches, and @ViewBuilder closure properties.

Limits: builders don't support for loops with side effects or let mutation — use ForEach. The old 10-child limit came from buildBlock overloads; since Swift 5.9 builders use parameter packs, so newer SDKs accept more children, but grouping related views is still better for readability.`,code:`struct Card<Content: View>: View {
  private let content: Content
  init(@ViewBuilder content: () -> Content) { self.content = content() }
  var body: some View {
    content
      .padding()
      .background(.background, in: .rect(cornerRadius: 12))
  }
}

@ViewBuilder
func statusView(for state: LoadState) -> some View {
  switch state {
  case .loading: ProgressView()
  case .loaded(let items): List(items) { Text($0.name) }
  case .failed: Label("Failed", systemImage: "exclamationmark.triangle")
  }
}`},{id:`sui7`,level:`Basic`,q:`What is @EnvironmentObject?`,short:`Object injected by ancestor into the environment, readable anywhere below without threading through views.`,a:`@EnvironmentObject reads an ObservableObject that an ancestor injected into the environment with .environmentObject(_:). Every descendant can read it without the object being passed through each intermediate view's initializer (avoiding "prop drilling"), and views that read it re-render when it publishes changes.

Good fits: genuinely app-wide or flow-wide state — the auth session, user settings, a theme, a navigation router, a cart.

Downsides:

• Runtime crash if no ancestor provided the object ("No ObservableObject of type X found") — previews and sheets are common places to forget it (in older iOS versions, sheets didn't inherit environment objects).
• Hidden dependency — the initializer doesn't show that the view needs it, which makes reuse and testing harder.
• Lookup is by type, so you can only have one object per type in a subtree.
• Same coarse invalidation as any ObservableObject.

For iOS 17+ with @Observable, use .environment(model) to inject and @Environment(Model.self) var model to read (crashes the same way if missing; use @Environment(Model.self) var model: Model? for an optional lookup). For simple values (colors, feature flags), define a custom EnvironmentKey — with the @Entry macro on newer SDKs — instead.`,code:`@main struct MyApp: App {
  @StateObject private var auth = AuthManager()
  var body: some Scene {
    WindowGroup { ContentView().environmentObject(auth) }
  }
}

struct ProfileView: View {
  @EnvironmentObject var auth: AuthManager    // no initializer parameter needed
  var body: some View { Text(auth.userName) }
}
#Preview { ProfileView().environmentObject(AuthManager.preview) }  // or it crashes`},{id:`sui8`,level:`Advanced`,q:`What is PreferenceKey? Give a real use case.`,short:`Lets child views bubble data UP to ancestors. Used for measuring sizes, syncing widths, sticky headers.`,a:`PreferenceKey sends data up the view tree — from children to an ancestor — which is the opposite direction of @Environment. A child attaches a value with .preference(key:value:); SwiftUI collects values from all children using the key's reduce(value:nextValue:) (e.g. take the max, append to an array), and an ancestor reads the combined result with .onPreferenceChange(_:perform:), or uses it during layout with overlayPreferenceValue / backgroundPreferenceValue. SwiftUI uses this mechanism itself for navigationTitle and toolbar, where a deep child configures a container above it.

Real uses:

• Measuring a child's rendered size (inside a GeometryReader in its background) and reporting it upward — e.g. sizing a sheet to its content.
• Equal widths: labels in a form report their widths, the parent takes the max and applies it to all.
• Scroll tracking: report a child's frame in a named coordinate space to drive a collapsing header.
• Anchors: anchorPreference reports bounds so the parent can draw a selection indicator or tooltip over a specific child.

On newer SDKs, onGeometryChange(for:of:action:) (back-deployed to iOS 16) is simpler for measuring a single view, and onScrollGeometryChange (iOS 18) for scroll offsets.`,code:`struct MaxWidthKey: PreferenceKey {
  static let defaultValue: CGFloat = 0
  static func reduce(value: inout CGFloat, nextValue: () -> CGFloat) {
    value = max(value, nextValue())
  }
}

struct Form: View {
  @State private var labelWidth: CGFloat = 0
  var body: some View {
    VStack(alignment: .leading) {
      ForEach(["Name", "Email address"], id: \\.self) { title in
        Text(title)
          .background(GeometryReader { proxy in
            Color.clear.preference(key: MaxWidthKey.self, value: proxy.size.width)
          })
          .frame(width: labelWidth > 0 ? labelWidth : nil, alignment: .leading)
      }
    }
    .onPreferenceChange(MaxWidthKey.self) { labelWidth = $0 }
  }
}`},{id:`sui9`,level:`Intermediate`,q:`What is @Bindable?`,short:`Creates bindings to properties of an @Observable object you don't own; can also be declared as a local var inside body.`,a:`With ObservableObject, @ObservedObject var vm gave you $vm.name bindings automatically. With @Observable models a received model is just a plain property, which can't produce bindings — that's what @Bindable (iOS 17+) adds: a property wrapper whose $ projection creates Bindings to the model's properties.

When you need it:

• A view receives an @Observable model and must edit it with controls that need a Binding (TextField, Toggle, Picker, NavigationStack(path:)).
• A model comes from @Environment(Model.self) — declare a local @Bindable var model = model inside body to get $model.property.
• Inside a ForEach over observable objects: ForEach(items) { item in @Bindable var item = item; ... }.

When you don't: an owner already holding the model in @State can use $model.name directly, and views that only read the model need no wrapper at all — observation tracking works through a plain property. @Bindable doesn't own or retain extra state; it's a thin binding factory.`,code:`@Observable final class Profile { var name = ""; var isPublic = false }

struct Editor: View {
  @Bindable var profile: Profile                     // received, editable
  var body: some View {
    Form {
      TextField("Name", text: $profile.name)
      Toggle("Public", isOn: $profile.isPublic)
    }
  }
}

struct RootView: View {
  @Environment(Router.self) private var router
  var body: some View {
    @Bindable var router = router                    // local @Bindable
    NavigationStack(path: $router.path) { HomeView() }
  }
}`},{id:`sui10`,level:`Intermediate`,q:`.task vs .onAppear { Task { } }?`,short:`.task starts when the view appears and is cancelled automatically when it disappears; .task(id:) restarts on id change.`,a:`.task ties the async work's lifetime to the view: it starts before the view appears and is cancelled when the view disappears. .task(id:) also cancels and restarts the work whenever the id changes — ideal for loading details for a selection. .onAppear { Task { } } creates an unstructured task that keeps running after the view disappears unless you store and cancel it yourself. Cancellation is cooperative, so the work must not swallow CancellationError.`,code:`.task(id: selectedID) {
  await model.loadDetail(for: selectedID) // previous load cancelled
}`},{id:`sui11`,level:`Intermediate`,q:`How does SwiftUI layout work, and why does modifier order matter?`,short:`Parent proposes a size, child chooses its own, parent places it. Each modifier wraps the view, so order changes the result.`,a:`Layout is a negotiation: the parent proposes a size, the child picks its own size (it may ignore the proposal), and the parent positions the child. Text respects the proposed width by wrapping or truncating; shapes fill what they're offered. Each modifier wraps the view in a new view, so .padding().background(.yellow) colors the padded area while .background(.yellow).padding() colors only behind the text.`,code:`Text("Hi").padding().background(.yellow) // yellow includes padding
Text("Hi").background(.yellow).padding() // yellow only behind text`},{id:`sui12`,level:`Intermediate`,q:`What's the problem with GeometryReader, and what are the alternatives?`,short:`It takes all offered space and pins children top-leading. Prefer containerRelativeFrame, ViewThatFits, or a custom Layout.`,a:`GeometryReader gives its content a GeometryProxy (size, safe-area insets, frames in coordinate spaces), but it has awkward layout behavior:

• It's greedy: it accepts the entire proposed size, so inside a VStack or ScrollView it grabs all available space (or collapses to a default height in a scroll view) and pushes siblings around.
• It places its content at the top-leading corner instead of centering it.
• Reading geometry and writing it back into @State can cause extra layout passes or even update loops.

Using it inside .background { GeometryReader { ... } } or .overlay avoids the sizing problem, because a background takes the size of the view it's attached to.

Modern alternatives:

• containerRelativeFrame (iOS 17) — size a view as a fraction of the nearest container (scroll view, navigation stack, window), e.g. carousel cards at 80% of the width.
• ViewThatFits (iOS 16) — choose the first child layout that fits (horizontal buttons, falling back to vertical).
• Layout protocol (iOS 16) — custom sizeThatFits / placeSubviews logic for flow layouts, radial layouts, equal-width rows.
• onGeometryChange(for:of:action:) — read a single value (size, frame) of a view without wrapping it, back-deployed to iOS 16.
• visualEffect (iOS 17) and scroll transitions — geometry-driven effects without state round-trips.`,code:`ScrollView(.horizontal) {
  LazyHStack {
    ForEach(cards) { card in
      CardView(card: card)

    }
  }
}

ViewThatFits {
  HStack { primaryButton; secondaryButton }   // try side by side
  VStack { primaryButton; secondaryButton }   // fall back to stacked
}

Text(title)
  .onGeometryChange(for: CGFloat.self) { $0.size.height } action: { titleHeight = $0 }`},{id:`sui13`,level:`Intermediate`,q:`How does value-based navigation with NavigationStack work?`,short:`Bind a path ([Route] or NavigationPath), push Hashable values, and map them to views with one navigationDestination per stack.`,a:`NavigationStack(path:) takes a binding to an array of Hashable route values (or a type-erased NavigationPath for mixed types); NavigationLink(value:) or path.append pushes, removing elements pops. Register navigationDestination(for:) once on the stack's content, not on each row — rows in lazy lists may not exist yet. A route enum must be Hashable, so every associated value must be Hashable too. Prefer a typed [Route] over NavigationPath, and give each tab its own path.`,code:`enum Route: Hashable { case detail(Place.ID), settings }
