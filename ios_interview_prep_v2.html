    .navigationDestination(for: Route.self) { route in destination(route) }
}`},{id:`sui14`,level:`Basic`,q:`Why is @State wrong for data passed in from a parent?`,short:`@State's initial value is used only once per view identity; later values from the parent are ignored.`,a:`@State storage is created once when the view first appears and then owned by SwiftUI, so a value passed in through the initializer is only used the first time — later updates from the parent are silently ignored. Use a plain let for read-only input, @Binding for two-way editing, or the @Observable model itself. Related: with @State var model = Model(), the initializer expression runs on every init of the view struct (the extra instances are discarded), so keep it cheap.`,code:`struct Detail: View {
  let place: Place             // ✅ follows parent updates
  // @State var place: Place   // ❌ keeps the first value only
  var body: some View { Text(place.name) }
}`},{id:`sui15`,level:`Advanced`,q:`Why is ForEach(0..<items.count) dangerous?`,short:`Identity becomes the index, so after inserts or deletes per-row state attaches to the wrong item and animations break.`,a:`ForEach identifies rows by their IDs. With indices as IDs, deleting item 0 makes the old row 1 become row 0, so SwiftUI keeps row 0's state (toggles, text drafts, focus) and applies it to a different item; animations also misfire. Use Identifiable models with stable ids. For editable rows, ForEach($items) { $item in ... } gives a binding per element while keeping identity stable.`,code:`ForEach(0..<items.count, id: \\.self) { i in Row(item: items[i]) } // ❌
ForEach($items) { $item in Toggle(item.name, isOn: $item.done) }  // ✅`},{id:`sui16`,level:`Intermediate`,q:`Animation vs transition in SwiftUI?`,short:`.animation / withAnimation animate property changes of a view that stays. .transition animates insertion and removal.`,a:`withAnimation { } or .animation(_:value:) interpolates changes to properties of views that remain in the hierarchy — position, color, scale. A transition describes how a view enters or leaves, so it only runs when the view is inserted or removed (an identity change, e.g. inside an if), and it needs the state change to happen inside an animation. iOS 17 lets you build reusable custom transitions with the Transition protocol.`,code:`if showDetail {
  DetailView().transition(.move(edge: .bottom))
}
Button("Toggle") { withAnimation { showDetail.toggle() } }`},{id:`sui17`,level:`Intermediate`,q:`How do you make a SwiftUI view accessible?`,short:`Combine related elements, give custom controls labels and traits, support Dynamic Type with @ScaledMetric, hide decoration.`,a:`Group related content with .accessibilityElement(children: .combine) so VoiceOver reads one element. Controls built from shapes plus onTapGesture get no traits — prefer Button or Toggle, or add a label, value and traits (.isToggle exists since iOS 17). Support Dynamic Type: use text styles, @ScaledMetric (iOS 14) for custom sizes, and avoid fixed heights that clip text. Hide decorative images, keep 44×44 pt targets, and test with VoiceOver and Xcode's accessibility audit (performAccessibilityAudit in UI tests).`,code:`HStack { Image(systemName: "star.fill"); Text(place.name) }
  .accessibilityElement(children: .combine)
@ScaledMetric(relativeTo: .body) var iconSize = 24.0
Image(decorative: "divider")`}],"Protocols & POP":[{id:`pp1`,level:`Basic`,q:`Why is Swift called a 'protocol-oriented' language?`,short:`Swift encourages designing via protocols and protocol extensions rather than class inheritance.`,a:`Apple introduced "protocol-oriented programming" at WWDC 2015 ("Protocol-Oriented Programming in Swift"). The idea: start a design from protocols (what a type can do) rather than from a base class (what a type is), and share behavior through protocol extensions instead of inheritance.

What makes Swift suited to it:

• Value types participate fully — structs and enums can conform to protocols, so you get polymorphism without classes, reference semantics or shared mutable state.
• Protocol extensions provide default implementations, so conformers get behavior for free (like a base class) while still being able to customize it.
• Retroactive modeling — you can make existing types, including standard-library and Apple types, conform to your protocols with an extension.
• Composition — a type conforms to many small protocols (Codable & Hashable & Identifiable), avoiding deep inheritance trees and the "fragile base class" problem.
• Generics and constraints — where clauses, associated types and conditional conformance let algorithms be written once against protocols; the standard library itself (Sequence, Collection) is built this way.

Benefits for apps: loose coupling, easy test doubles (conform a mock to the protocol), and reusable behavior across unrelated types. Swift is still multi-paradigm — classes are the right tool for identity and UIKit — so "protocol-oriented" is a default design approach, not a rule.`,code:`protocol Identifiable2 { var id: String { get } }
protocol Describable { var summary: String { get } }

extension Describable where Self: Identifiable2 {       // shared default behavior
  var summary: String { "Item \\(id)" }
}

struct Product: Identifiable2, Describable { let id: String }   // struct, no base class
print(Product(id: "42").summary)                                 // "Item 42"`},{id:`pp2`,level:`Basic`,q:`What is Protocol Composition in Swift?`,short:`Combining multiple protocols into one requirement using &. e.g., Codable & Equatable.`,a:`Protocol composition combines several protocols into one type requirement with &: Encodable & Equatable means "a type that conforms to both". It doesn't create a new protocol; it's an anonymous intersection you can use anywhere a type is expected:

• generic constraints: func save<T: Codable & Identifiable>(_ item: T),
• existentials: let item: any Codable & Hashable,
• opaque types: some View & Equatable,
• type aliases: typealias Codable = Encodable & Decodable — the standard library defines Codable exactly this way.

It can also include one class type, which requires the value to be that class (or subclass) *and* conform: UIViewController & Refreshable is a view controller that can refresh — handy for coordinators and child-VC containers.

Why use it instead of a new combined protocol: it keeps protocols small (Interface Segregation), lets each API ask for exactly the capabilities it needs, and avoids inventing protocol names like CodableHashableIdentifiable. Create a named protocol instead when the combination has its own meaning or adds requirements.`,code:`func isSame<T: Encodable & Equatable>(_ a: T, _ b: T) -> Bool { a == b }

typealias Persistable = Codable & Identifiable

protocol Refreshable { func refresh() }
func refreshAll(_ screens: [UIViewController & Refreshable]) {
  screens.forEach { $0.refresh() }       // class + protocol
}`},{id:`pp3`,level:`Intermediate`,q:`What is an associatedtype in a protocol?`,short:`A placeholder type in a protocol that conforming types define concretely. Enables generic protocols.`,a:`An associatedtype is a placeholder type inside a protocol; each conforming type decides what it concretely is. It makes protocols generic: Sequence has associatedtype Element, so [Int] is a sequence of Int and String a sequence of Character. Conforming types can state the type with a typealias, but usually the compiler infers it from method signatures.

You can constrain associated types (associatedtype Item: Codable) and use them in where clauses (extension Container where Item: Equatable).

Using such a protocol as a type:

• Historically, a protocol with associated types (PAT) couldn't be used as a plain type ("can only be used as a generic constraint"), so you wrote generics or type-erasers like AnyPublisher/AnySequence.
• Swift 5.7 introduced any Container existentials for these protocols, and primary associated types — protocol Container<Item> — which allow lightweight constraints: some Collection<Int>, any Collection<String>. This removes many hand-written type erasers.

Generic constraints (<C: Container> or some Container) are still preferred when performance matters, because the compiler knows the concrete type.`,code:`protocol Container<Item> {               // Item is a primary associated type
  associatedtype Item
  mutating func add(_ item: Item)
  func item(at i: Int) -> Item
}

struct Box<T>: Container {               // Item inferred as T
  private var items: [T] = []
  mutating func add(_ item: T) { items.append(item) }
  func item(at i: Int) -> T { items[i] }
}

func firstOf(_ c: some Container<String>) -> String { c.item(at: 0) }
let anyBox: any Container<Int> = Box<Int>()`},{id:`pp4`,level:`Intermediate`,q:`What is conditional conformance?`,short:`A generic type conforms to a protocol only when its type parameter meets certain conditions.`,a:`Conditional conformance (Swift 4.1, SE-0143) lets a generic type conform to a protocol only when its type parameters meet requirements. It's written as an extension with a where clause.

Standard-library examples:

• Array: Equatable where Element: Equatable — [1, 2] == [1, 2] works, but arrays of non-Equatable types can't be compared.
• Optional: Hashable where Wrapped: Hashable, Dictionary: Codable where Key: Codable, Value: Codable.
• Array: Codable where Element: Codable — which is why decoding [User].self just works.

Why it matters: before it existed, the library needed separate types or runtime checks; now generic wrappers compose naturally — a Result<User, MyError> is Equatable if both parameters are, an Array<Array<Int>> is Hashable, and your own Box<T> can be Codable exactly when T is.

Limitations: a type can conform to a given protocol only once — you can't have two different conditional conformances to the same protocol with different conditions. The compiler can also synthesize Equatable, Hashable and Codable in a conditional extension.`,code:`struct Box<T> { var value: T }
extension Box: Equatable where T: Equatable {}   // == synthesized only when T: Equatable
extension Box: Codable where T: Codable {}

Box(value: 1) == Box(value: 1)                    // ✅ Int is Equatable
// Box(value: UIView()) == Box(value: UIView())  // ❌ no conformance`},{id:`pp5`,level:`Basic`,q:`Explain Equatable, Hashable, and Comparable.`,short:`Equatable: ==. Hashable: hash value for Set/Dictionary (requires Equatable). Comparable: ordering with <.`,a:`• Equatable — defines == (and != for free). Value equality, not identity.
• Hashable — refines Equatable and adds hash(into:), which feeds the significant properties into a Hasher. Required for Set elements and Dictionary keys, and for SwiftUI ForEach(id:) and diffable data sources.
• Comparable — refines Equatable and adds <; you get >, <=, >=, min, max and sorted() for free.

Why Hashable inherits Equatable: hash-based collections first jump to a bucket using the hash, then confirm with ==. The rule is if a == b, then a.hashValue == b.hashValue (equal values must hash equally; unequal values may collide). Hash the same properties you compare in == — hashing a property you don't compare breaks this rule.

Synthesis: the compiler writes these for you when all stored properties conform — Equatable and Hashable for structs and enums, and Comparable for enums without associated values (cases compare in declaration order, Swift 5.3). Note that hash values are randomly seeded per process launch, so never persist hashValue or use it as a stable ID.`,code:`struct Version: Hashable, Comparable {
  let major: Int, minor: Int
  static func < (a: Version, b: Version) -> Bool {
    (a.major, a.minor) < (b.major, b.minor)          // tuple comparison
  }
}

enum Priority: Comparable { case low, medium, high }  // synthesized: low < high

let latest = [Version(major: 1, minor: 2), Version(major: 2, minor: 0)].max()
var seen: Set<Version> = []                            // needs Hashable`},{id:`pp6`,level:`Basic`,q:`What is the Codable protocol?`,short:`Type alias for Encodable & Decodable. Compiler synthesizes encode/decode for qualifying types.`,a:`Codable is a type alias for Encodable & Decodable. When all stored properties are themselves Codable (String, Int, Date, URL, arrays, dictionaries, optionals, nested Codable types), the compiler synthesizes encode(to:) and init(from:) and a private CodingKeys enum. Encoders/decoders for a format (JSONEncoder/JSONDecoder, PropertyListEncoder) walk those keys.

Customizing:

• Rename keys with a CodingKeys enum (case firstName = "first_name"), or set decoder.keyDecodingStrategy = .convertFromSnakeCase. Properties left out of CodingKeys are skipped (they need a default value).
• Dates and data: dateDecodingStrategy (.iso8601, .secondsSince1970, .formatted, .custom), dataDecodingStrategy.
• Custom logic: implement init(from:) to handle missing keys (decodeIfPresent), default values, polymorphic payloads, or flattening nested JSON with nestedContainer.
• Optionals: a missing key or null decodes to nil for optional properties; for non-optional properties it throws.

Errors are typed DecodingError cases (keyNotFound, typeMismatch, valueNotFound, dataCorrupted) with a codingPath — log them, they pinpoint the bad field. Reuse one configured decoder rather than creating one per request.`,code:`struct User: Codable {
  let id: Int
  let firstName: String
  let joined: Date
  var isAdmin = false

  enum CodingKeys: String, CodingKey { case id, firstName = "first_name", joined }  // isAdmin not decoded
}

let decoder = JSONDecoder()
decoder.dateDecodingStrategy = .iso8601
do {
  let user = try decoder.decode(User.self, from: json)
} catch let DecodingError.keyNotFound(key, ctx) {
  print("Missing \\(key.stringValue) at \\(ctx.codingPath)")
}`},{id:`pp7`,level:`Intermediate`,q:`How do you create optional protocol methods in Swift?`,short:`Protocol extension with default no-op implementation (preferred, works with structs). Or @objc optional (classes only).`,a:`Swift protocols have no optional keyword for pure-Swift code — every requirement must be implemented. Two ways to get the effect:

1. Default implementation in a protocol extension (preferred). Declare the method in the protocol and give it an empty (or sensible) body in an extension; conformers override it only if they care. Works with structs, enums and classes, stays type-safe, and calls dispatch dynamically to the conformer's version because the method is a protocol requirement. Be careful: if a method is only in the extension and not declared in the protocol, calls through the protocol type will always use the default (static dispatch — see Q27).
2. @objc optional — mark the protocol @objc and the method @objc optional. Only classes (Objective-C compatible) can conform, parameter types must be representable in Objective-C, and callers must use optional chaining (delegate?.didFail?()) because the method might not exist. This is how UIKit's delegate protocols work.

A third design option is to split the protocol into a required one and an optional one (Interface Segregation), or use closures for optional callbacks.`,code:`protocol PlayerDelegate: AnyObject {
  func didFinish()        // required
  func didPause()         // "optional" via default below
}
extension PlayerDelegate {
  func didPause() {}      // default no-op
}

@objc protocol LegacyDelegate {
  @objc optional func didFail(_ error: NSError)
}
// call site: delegate?.didFail?(error)`},{id:`pp8`,level:`Advanced`,q:`How does protocol conformance compare to class inheritance for performance?`,short:`Generics/some: can be specialized to static dispatch (fastest). Existentials (any P): container plus witness-table dispatch (slowest).`,a:`Non-final class methods use vtable dispatch; protocol requirements called through a generic or existential use witness-table dispatch — similar cost. Generic code constrained to a protocol can be specialized by the optimizer into static dispatch with inlining, the fastest option. Existentials (any Protocol) add an existential container (inline buffer for values up to 3 words, a heap box beyond that), dynamic dispatch, and they block specialization. Prefer some P or <T: P> over any P in hot paths.`,code:null}],"Memory & ARC":[{id:`ma1`,level:`Basic`,q:`How does ARC work?`,short:`Compiler inserts retain/release calls. Object deallocates immediately when strong reference count reaches zero.`,a:`Automatic Reference Counting manages the memory of class instances (and closures, actors). The compiler inserts retain (increment) and release (decrement) operations at compile time wherever references are created, copied or go away; there is no background collector.

How it works:

• Each heap object keeps a strong reference count. Assigning an instance to a var, let, property, collection or closure capture creates a strong reference (+1); when that reference is overwritten or goes out of scope, it's released (−1).
• When the strong count reaches zero, deinit runs immediately and memory is freed — deterministic, unlike garbage collection.
• weak references don't keep the object alive and become nil when it's deallocated (Swift implements them via a side table); unowned references don't keep it alive either but are non-optional.
• The optimizer removes many redundant retain/release pairs, but reference counting operations are atomic and have real cost in hot loops.

What ARC doesn't do: break reference cycles (two objects holding each other strongly never reach zero — you must use weak/unowned), and it doesn't manage value types directly (structs are copied, but references *inside* them are counted), or C memory (malloc, Core Foundation objects from functions not annotated — though most CF APIs are bridged automatically).`,code:`class Person {
  let name: String
  init(name: String) { self.name = name }
  deinit { print("\\(name) freed") }
}

var a: Person? = Person(name: "Ahmed")   // count 1
var b = a                                // count 2
a = nil                                  // count 1
b = nil                                  // count 0 → "Ahmed freed" immediately`},{id:`ma2`,level:`Basic`,q:`Difference between strong, weak, and unowned references?`,short:`Strong: owns (ARC++). Weak: no ownership, auto-nil on dealloc. Unowned: no ownership, non-Optional, crashes if nil.`,a:`• strong (the default): keeps the object alive; the referenced object can't be deallocated while this reference exists.
• weak: doesn't increase the strong count. When the object is deallocated, the reference automatically becomes nil, so it must be an optional var. Accessing it is always safe — you just might get nil.
• unowned: doesn't increase the strong count and is non-optional — you're asserting the referenced object will always outlive this reference. Accessing it after the object is deallocated crashes deterministically (Swift checks this). unowned(unsafe) skips the check — faster, but a dangling pointer like Objective-C's assign.

When to use which:

• weak for delegates, data sources, parent back-references, and closures that might outlive self ([weak self]) — whenever lifetimes are independent.
• unowned when the lifetimes are tied and the other object is guaranteed to live at least as long: a CreditCard that can't exist without its Customer, or a closure stored by self that only runs while self exists.
• When unsure, use weak — a nil check is cheaper than a crash.

Both weak and unowned can only apply to class (reference) types, and protocols used with them must be class-constrained (AnyObject). Since Swift 5, unowned can also be optional (unowned var x: T?).`,code:`protocol Delegate: AnyObject {}
final class VC { weak var delegate: Delegate? }   // independent lifetime

final class Customer { var card: CreditCard? }
final class CreditCard {
  unowned let owner: Customer                      // card never outlives owner
  init(owner: Customer) { self.owner = owner }
}`},{id:`ma3`,level:`Intermediate`,q:`What is a retain cycle? Give an example.`,short:`Two objects strongly reference each other — neither count reaches zero. Memory leaks permanently.`,a:`A retain cycle (strong reference cycle) happens when objects reference each other strongly, directly or through a chain, so none of their reference counts can ever reach zero. Even after your code drops every outside reference, they keep each other alive — a memory leak that also keeps their observers, timers and network callbacks running.

Common shapes in iOS code:

1. Two objects holding strong properties to each other (parent ↔ child, VC ↔ its custom view that stores the VC).
2. Closures stored by self that capture self strongly — completion handlers, lazy var closures, Combine sink, Timer blocks, NotificationCenter block observers (Q72, Q77, Q78).
3. Delegates declared strong instead of weak.
4. Timers — a repeating Timer with target: self is retained by the run loop and retains its target until invalidated.
5. Doubly linked structures (Q79) and child-to-parent coordinator references.

Fix: decide which side owns the other and make the back-reference weak (or unowned when lifetimes are tied), use capture lists in closures, and invalidate/cancel long-lived callbacks. Detect: add deinit logging, use the Memory Graph Debugger, the Leaks instrument, or a weak-reference unit test (Q80).`,code:`final class Parent {
  var child: Child?
  deinit { print("Parent freed") }
}
final class Child {
  weak var parent: Parent?     // weak breaks the cycle
  deinit { print("Child freed") }
}

var p: Parent? = Parent()
p?.child = Child()
p?.child?.parent = p
p = nil                        // both deinit messages print`},{id:`ma4`,level:`Intermediate`,q:`How do retain cycles form in closures?`,short:`Closure captures self strongly by default inside a class. If self owns the closure, both keep each other alive.`,a:`Closures are reference types that capture the variables they use. In a class, using self (explicitly, or implicitly by touching a property or method) captures self strongly by default. If self also stores that closure — in a property, an array of handlers, a Combine subscription, a timer it owns — then self → closure → self is a cycle and neither is freed.

Fix with a capture list:

• [weak self] — self becomes optional inside the closure. Use guard let self else { return } (Swift 5.7 shorthand) to get a strong reference for the rest of the body, so self can't disappear halfway through. Safe whenever self might be deallocated before the closure runs.
• [unowned self] — non-optional, no unwrapping, but crashes if self is gone when the closure runs. Use only when the closure can't outlive self.
• Capture what you need instead of self: [api, id] in api.load(id) captures those values, not the whole object.

Capture lists are evaluated when the closure is created, not when it runs. Also remember a cycle needs ownership: non-escaping closures and short one-shot async closures don't create leaks (Q77).`,code:`final class SearchVM {
  var onResults: (([String]) -> Void)?
  private let api = API()

  func setup() {
    onResults = { [weak self] results in      // self stores this closure
      guard let self else { return }
      self.render(results)
    }
  }

  func search(_ q: String) {
    api.search(q) { [api] _ in _ = api }      // capture a dependency, not self
  }
}`},{id:`ma5`,level:`Intermediate`,q:`What is Copy-on-Write (CoW)? How do you implement it for a custom type?`,short:`Shared buffer until mutation. isKnownUniquelyReferenced checks before copying to avoid unnecessary copies.`,a:`Copy-on-write makes value types with large storage cheap to copy. A CoW type is a struct that wraps a reference to a heap buffer. Copying the struct just copies the reference (and retains it), so both copies share the buffer. Only when one copy is mutated while the buffer is shared does it make a real copy first. The result: value semantics (copies are independent) with reference-like performance for reads and passing around.

Array, Dictionary, Set and String all use CoW. That's why passing an array to a function or assigning it is O(1), and why the first mutation after a copy can be O(n).

Implementing it yourself:

1. Put the data in a private final class Storage.
2. Expose it through a struct.
3. In every mutating path, call isKnownUniquelyReferenced(&storage); if it returns false, replace storage with a copy before writing.

Note that custom structs don't get CoW automatically — a struct holding a few Ints is just copied (which is cheap). CoW only applies to types that implement it, and a struct holding a class reference without CoW logic would share mutations — breaking value semantics. Also keep the uniqueness check thread-safe by mutating only through mutating methods on vars.`,code:`struct Buffer {
  private final class Storage {
    var values: [Int]
    init(_ values: [Int]) { self.values = values }
  }
  private var storage = Storage([])

  var values: [Int] { storage.values }

  mutating func append(_ v: Int) {
    if !isKnownUniquelyReferenced(&storage) {   // shared? copy first
      storage = Storage(storage.values)
    }
    storage.values.append(v)
  }
}

var a = Buffer(); a.append(1)
var b = a          // shares storage
b.append(2)        // copies now; a.values == [1], b.values == [1, 2]`},{id:`ma6`,level:`Advanced`,q:`Difference between ARC and garbage collection?`,short:`ARC: deterministic, compiler-inserted retain/release, immediate dealloc, no cycle detection. GC: runtime tracing, handles cycles.`,a:`ARC is deterministic — an object is freed as soon as its last strong reference goes away, at compiler-inserted release points. It has no collector pauses, but it is not free: every retain and release is an atomic operation with real runtime cost (the optimizer removes many of them), and ARC cannot reclaim reference cycles. Garbage collection (Java, Go) periodically finds unreachable objects at runtime — it handles cycles automatically but adds memory overhead and less predictable pauses. ARC's predictability suits latency-sensitive mobile apps.`,code:null},{id:`ma7`,level:`Advanced`,q:`How do you debug memory leaks in iOS?`,short:`Instruments: Leaks instrument with allocation backtraces. Memory Graph Debugger for visual reference cycles.`,a:`1. Notice it: memory growth in Xcode's Debug Navigator gauge when repeating an action (open/close a screen 5 times), or a missing deinit log. Adding deinit { print("\\(Self.self) freed") } to view controllers and view models in debug builds is the cheapest early warning.
2. Memory Graph Debugger (Debug Memory Graph button in the debug bar): pauses the app and shows every live object and the references keeping it alive. Leaked objects are flagged with a purple "!", and filtering by your type name shows instances that should be gone. Enable Malloc Stack Logging (Scheme → Diagnostics, "Live allocations only") to see the allocation backtrace for each object.
3. Instruments → Leaks: detects unreachable cycles over time with backtraces. Combine with the Allocations instrument and Mark Generation to find growth that isn't a true leak (e.g. an unbounded cache, abandoned memory).
4. Fix the reference: usually a closure capturing self stored by self, a strong delegate, an un-invalidated Timer, a NotificationCenter block observer, a Combine sink without [weak self], or a parent ↔ child strong pair.
5. Prevent regressions with a weak-reference unit test (Q80).

Fixes:

}`}],Concurrency:[{id:`co1`,level:`Basic`,q:`What is GCD and its Quality of Service (QoS)?`,short:`GCD manages thread pools automatically. QoS: userInteractive > userInitiated > default > utility > background.`,a:`Grand Central Dispatch (libdispatch) is Apple's C-level concurrency library. Instead of creating and managing threads, you submit work items (closures) to queues, and GCD runs them on a system-managed thread pool sized to the hardware. Key pieces: the main queue (serial, runs on the main thread — all UI work), global concurrent queues per QoS, custom serial/concurrent queues, plus DispatchGroup, DispatchSemaphore, DispatchWorkItem (cancellable), asyncAfter, and dispatch sources (timers, file events).

Quality of Service tells the system how important the work is, which affects CPU scheduling priority, I/O priority and energy (efficiency cores, timer coalescing). From highest to lowest:

• .userInteractive — must finish within a frame: animations, event handling, main thread work.
• .userInitiated — the user started it and is waiting: opening a document, loading a tapped item.
• .default — between the two; the fallback when none is specified.
• .utility — long-running with visible progress, user not blocked: downloads, imports.
• .background — invisible maintenance: backups, prefetching, indexing; may be heavily throttled (e.g. in Low Power Mode).

  let result = heavyComputation()
  DispatchQueue.main.async { self.update(result) }   // UI back on main
}

DispatchQueue.global(qos: .background).asyncAfter(deadline: .now() + 2, execute: work)
work.cancel()   // cancels only if it hasn't started`},{id:`co2`,level:`Basic`,q:`Difference between serial and concurrent queues?`,short:`Serial: one task at a time in FIFO order. Concurrent: multiple tasks can run simultaneously.`,a:`• Serial queue: runs one work item at a time, in FIFO order; the next starts only when the previous finishes. Items may run on different threads, but never simultaneously. The main queue is serial. Custom queues are serial by default: DispatchQueue(label:).
• Concurrent queue: starts items in FIFO order, but may run many at once, as threads are available, and they can finish in any order. The global queues are concurrent; create your own with attributes: .concurrent.

Uses:

• A serial queue as a lock: route every read and write of some shared state through it — no data races because only one closure touches the state at a time.
• A concurrent queue with barriers for the reader–writer pattern: reads run in parallel with sync, writes use async(flags: .barrier), which waits for in-flight reads, runs alone, then lets reads continue. (Barriers only work on custom concurrent queues, not global ones.)

Separate concept: sync vs async is about the caller — sync blocks the calling thread until the item finishes; async returns immediately. Calling sync on the serial queue you're already on deadlocks (Q7). In new code, an actor replaces the "serial queue protecting state" pattern.`,code:`final class ThreadSafeCache {
  private var storage: [String: Data] = [:]
  private let queue = DispatchQueue(label: "cache", attributes: .concurrent)

  func value(for key: String) -> Data? {

  }
  func set(_ data: Data, for key: String) {
    queue.async(flags: .barrier) { self.storage[key] = data }   // exclusive write
  }
}`},{id:`co3`,level:`Intermediate`,q:`What is a DispatchGroup and when do you use it?`,short:`Coordinates multiple async tasks, notifying when ALL have completed. enter/leave balance the count.`,a:`A DispatchGroup tracks a set of tasks and tells you when all of them have finished. It's essentially a counter:

• enter() increments it before each asynchronous task starts;
• leave() decrements it when that task completes (in every path, including errors — defer { group.leave() } helps);
• notify(queue:execute:) schedules a block to run when the counter returns to zero, without blocking;
• wait() / wait(timeout:) blocks the current thread until then — never on the main thread.

For work you submit yourself, queue.async(group: group) { ... } enters and leaves automatically — but only if the work is synchronous inside the closure.

Typical uses: firing several API calls in parallel and updating the UI once all have returned, downloading a batch of images, or waiting for multiple SDKs to initialize.

Pitfalls: unbalanced calls — more leave() than enter() crashes; a missing leave() means notify never fires. Results usually need to be collected into shared state, which then needs synchronization. In modern Swift, async let or a task group replaces DispatchGroup with structured, cancellable and type-safe code.`,code:`let group = DispatchGroup()

var posts: [Post] = []

group.enter()
fetchUser { result in defer { group.leave() }; user = try? result.get() }
group.enter()
fetchPosts { result in defer { group.leave() }; posts = (try? result.get()) ?? [] }

group.notify(queue: .main) { self.render(user, posts) }   // both done

// Modern equivalent:
// async let u = fetchUser(); async let p = fetchPosts()
// render(try await u, try await p)`},{id:`co4`,level:`Intermediate`,q:`What is a DispatchSemaphore?`,short:`Counting signal that blocks threads. Controls maximum concurrent accesses to a resource.`,a:`A DispatchSemaphore is a counter with blocking: wait() decrements it and, if the result is below zero, blocks the current thread until someone calls signal(), which increments it and wakes a waiter. The initial value decides its role:

• Value 1 — acts like a mutex (but prefer a real lock).
• Value 0 — a signal: one thread waits until another finishes something — historically used to make async APIs synchronous in tests or scripts.

Compared with DispatchGroup: a group tells you when a set of tasks has finished; a semaphore limits or gates access.

Cautions: blocking wastes a thread and can cause thread explosion; waiting on the main thread freezes the UI; a semaphore has no owner, so the system can't apply priority inheritance — priority inversion (Q89); and a forgotten signal() deadlocks forever. Never use semaphore.wait() inside Swift concurrency to wait for async work (Q97). Modern replacements: an actor or TaskGroup with a manual limit for bounded concurrency, OperationQueue.maxConcurrentOperationCount, URLSessionConfiguration.httpMaximumConnectionsPerHost, and await instead of waiting.`,code:`let semaphore = DispatchSemaphore(value: 3)   // max 3 at once
for url in urls {
  DispatchQueue.global().async {
    semaphore.wait()
    defer { semaphore.signal() }
    download(url)
  }
}

// Async alternative: bounded task group
try await withThrowingTaskGroup(of: Void.self) { group in
  for (i, url) in urls.enumerated() {
    if i >= 3 { try await group.next() }      // keep at most 3 in flight
    group.addTask { try await download(url) }
  }
  try await group.waitForAll()
}`},{id:`co5`,level:`Intermediate`,q:`What is async/await? How does it compare to completion handlers?`,short:`Sequential-looking async code. No callback nesting. Errors propagate with throw/catch. No thread blocking.`,a:`async/await (Swift 5.5, SE-0296) lets asynchronous code be written top-to-bottom like synchronous code. An async function can suspend at each await; while suspended, its thread is released to run other work, and the function later resumes — possibly on a different thread (unless it's isolated to an actor such as @MainActor).

Compared with completion handlers:

• Readability: no "pyramid of doom" of nested closures; loops, if, guard and defer work naturally across async steps.
• Errors: throws + try + do/catch instead of passing Result/Error? through every callback and forgetting a path.
• Correctness: the compiler guarantees the function returns exactly once — with completion handlers it's easy to forget to call it on an error path, or call it twice.
• Cancellation & structure: tasks form a tree, cancellation propagates, and async let / task groups express parallelism (Q86).
• Safety: combined with actors and Sendable, the compiler checks for data races.
• Threading: @MainActor code is guaranteed to run on the main thread, removing DispatchQueue.main.async hops.

fetchUser(id) { result in
  switch result {
  case .success(let user):
    fetchAvatar(user.avatarURL) { image in self.show(user, image) }
  case .failure(let error): self.showError(error)
  }
}

// After: linear, errors propagate with throw
@MainActor func load(id: Int) async {
  do {
    let user = try await api.fetchUser(id)
    let avatar = try await api.fetchImage(user.avatarURL)
    show(user, avatar)                 // already on the main actor
  } catch {
    showError(error)
  }
}`},{id:`co6`,level:`Intermediate`,q:`What is structured concurrency in Swift?`,short:`Child tasks cannot outlive their parent scope. Cancellation and errors propagate automatically.`,a:`Structured concurrency means concurrent work has a scope, just like a local variable: child tasks are created inside a scope and are guaranteed to complete (or be cancelled and awaited) before that scope exits. Tasks form a tree — a parent task and its children.

What the structure gives you:

• No leaks of work: a child can't outlive its parent; if you return or throw early, remaining children are cancelled and awaited automatically.
• Cancellation propagates down: cancelling a parent cancels all its children.
• Errors propagate up: if a child throws in a throwing task group or async let you await, the error reaches the parent and siblings are cancelled.
• Inheritance: children inherit priority and task-local values.

The structured tools are async let (a fixed number of child tasks) and withTaskGroup / withThrowingTaskGroup / withDiscardingTaskGroup (a dynamic number). SwiftUI's .task modifier is also scoped — to the view's lifetime.

Unstructured tasks — Task { } and Task.detached { } — have no parent scope: you must keep the handle to cancel them, and they run until they finish. They're needed to start async work from synchronous code (a button action), but prefer structured tools inside async code.`,code:`func loadProfile(id: Int) async throws -> Profile {
  async let user = fetchUser(id: id)        // child task 1 starts now
  async let posts = fetchPosts(userId: id)  // child task 2 runs in parallel
  // If fetchUser throws, the posts task is cancelled automatically.
  return try await Profile(user: user, posts: posts)
}   // no child can outlive this function`},{id:`co7`,level:`Intermediate`,q:`What is an Actor in Swift?`,short:`Reference type serializing access to mutable state. Accessing from outside requires await. Prevents data races.`,a:`An actor is a reference type (like a class) that protects its mutable state from data races. Only one task at a time can execute code isolated to a given actor; other callers wait their turn. Unlike a lock, waiting doesn't block a thread — the caller suspends at an await.

Rules the compiler enforces:

• From outside, accessing an actor's methods or mutable properties is asynchronous — you must await, because you may have to wait for the actor.
• From inside, access is synchronous.
• Values passed in or out must be Sendable (Q23).
• nonisolated members opt out of isolation (for immutable data or pure computation) and can be called synchronously.

Actors don't support inheritance, and they're always Sendable.

Global actors apply one actor's isolation across many types and functions. @MainActor is the global actor bound to the main thread: mark view models, UI code and properties with it to guarantee they run on the main thread. In Xcode 26, new app projects set default actor isolation to MainActor (SE-0466), so unannotated code in the app target is main-actor isolated unless you mark it nonisolated or @concurrent.

Remember reentrancy (Q88): an actor method that awaits lets other calls run in between, so state can change across suspension points.`,code:`actor BankAccount {
  private(set) var balance: Decimal = 0
  let id: UUID = UUID()                    // immutable: safe to read

  func deposit(_ amount: Decimal) { balance += amount }   // isolated
  nonisolated var displayID: String { id.uuidString }     // no await needed
}

let account = BankAccount()
await account.deposit(100)                 // await from outside
print(await account.balance)
print(account.displayID)

@MainActor final class AccountVM {         // always on the main thread
  var text = ""
}`},{id:`co8`,level:`Advanced`,q:`What is actor reentrancy and why is it dangerous?`,short:`Actor suspends at await, allowing other tasks in. State may change before resumption — invariants can break.`,a:`Actors serialize execution, but they are reentrant: when an actor-isolated method reaches an await, it suspends and gives up the actor, so other queued calls can run on the same actor and mutate its state. When the first call resumes, the state it checked before the await may no longer be true. The actor holds no lock across suspension points — that's a deliberate design choice to avoid deadlocks.

The bug pattern: check → await → act. In the bank example, two transfers both pass the balance check, both suspend at await other.deposit, and the account ends up negative; or a cache method checks "not cached", awaits a download, and two callers download the same image twice.

How to deal with it:

• Mutate state before the await, not after (deduct first, refund on failure).
• Re-check invariants after every await.
• Keep critical sections synchronous — do the state change in one non-suspending method.
• For "do this only once" work, store an in-flight Task in the actor and let later callers await the same task (see Q95, Q128, Q169).`,code:`actor Account {
  var balance: Decimal = 1000

  func transfer(to other: Account, amount: Decimal) async throws {

    } catch {
      balance += amount                // roll back on failure
      throw error
    }
  }
}`},{id:`co9`,level:`Advanced`,q:`What is priority inversion?`,short:`High-priority task blocked on a resource held by a low-priority task. Medium tasks run freely, starving the high-priority one.`,a:`Priority inversion: a high-priority task is blocked waiting for a resource (lock, queue) held by a low-priority task, while medium-priority work keeps running and starves it. GCD and the Swift runtime mitigate this with priority inheritance/escalation: when higher-priority work waits on a serial queue, an os_unfair_lock, or an actor, the work it is waiting on gets boosted. DispatchSemaphore cannot be boosted because it has no owner — one more reason not to use semaphores to wait for async work.`,code:null},{id:`co10`,level:`Advanced`,q:`What is thread explosion? How does async/await prevent it?`,short:`Too many blocked threads exhaust the pool. async/await suspends without blocking, on a pool of about one thread per core.`,a:`Thread explosion: many GCD work items block (on locks, synchronous I/O, semaphores), so GCD keeps spawning threads to keep cores busy — potentially dozens or hundreds of blocked threads, each with its own stack (512 KB by default for secondary threads) and context-switch overhead. Swift concurrency prevents this: awaiting suspends the task instead of blocking the thread, and the cooperative pool is limited to roughly one thread per CPU core, so the freed thread runs other tasks.`,code:null},{id:`co11`,level:`Intermediate`,q:`Task {} vs Task.detached {}?`,short:`Task {} inherits actor isolation, priority and task-locals. Task.detached inherits none — rarely what you want.`,a:`Task { } created on the main actor runs its body on the main actor and inherits priority and task-local values; it's unstructured, so you keep the handle if you need to cancel it. Task.detached starts with no actor isolation, its own priority, and no task-locals. Prefer structured child tasks (async let, task groups), then Task; use detached only when you explicitly must not inherit context. Neither is cancelled automatically when the creating scope ends.`,code:null},{id:`co12`,level:`Intermediate`,q:`async let vs TaskGroup?`,short:`async let: a fixed number of concurrent children known at compile time. TaskGroup: a dynamic number of children.`,a:`Both create structured child tasks that can't outlive their scope and are cancelled if the scope exits early. async let suits a known, small set of different operations awaited together. withTaskGroup/withThrowingTaskGroup suits a dynamic collection — one child per URL — and yields results in completion order, not submission order, so carry an index if order matters. If a child throws in a throwing group, remaining children are cancelled when the error propagates.`,code:`let images = try await withThrowingTaskGroup(of: UIImage.self) { group in
  for url in urls { group.addTask { try await load(url) } }
  var result: [UIImage] = []
  for try await img in group { result.append(img) }
  return result // completion order, not input order
}`},{id:`co13`,level:`Intermediate`,q:`How does task cancellation work in Swift concurrency?`,short:`Cooperative: cancel() only sets a flag. Check Task.isCancelled or call checkCancellation(); many APIs throw CancellationError.`,a:`Cancelling a task — directly, via its parent, or when a SwiftUI .task's view disappears — only marks it cancelled; nothing stops on its own. Long loops should call try Task.checkCancellation() or check Task.isCancelled. Task.sleep and URLSession's async APIs throw CancellationError when cancelled. A common bug is try? await Task.sleep(...), which swallows the CancellationError so the code carries on and writes stale results. withTaskCancellationHandler reacts immediately to cancellation.`,code:`func load(id: Int) async throws -> Detail {

  try await withCheckedThrowingContinuation { continuation in

    continuation.onTermination = { _ in delegate.stop() }
    delegate.start()

}`},{id:`co15`,level:`Advanced`,q:`Data race vs race condition — what do actors prevent?`,short:`Data race: unsynchronized concurrent access with a write. Race condition: logic depends on timing. Actors prevent only the first.`,a:`A data race is memory-unsafe concurrent access where at least one access is a write; Swift 6's compile-time checking and actor isolation eliminate it. A race condition is a logic bug where the result depends on timing, and actors don't prevent it: an actor method that checks a cache, awaits a download, then writes can run twice concurrently because of reentrancy, downloading the same thing twice. Fix it by storing the in-flight Task in the actor and having later callers await it.`,code:null},{id:`co16`,level:`Advanced`,q:`Where does a nonisolated async function run? What is @concurrent?`,short:`Before Swift 6.2 (or with the feature off): the global executor. With SE-0461: the caller's actor, unless marked @concurrent.`,a:`This depends on the language mode and build settings, so know both behaviors:

• Before Swift 6.2, or with the feature off (SE-0338): a nonisolated async function always leaves the caller's actor and runs on the global concurrent executor (the cooperative thread pool). Calling it from @MainActor code hops off the main thread — good for heavy work, but every argument and result must be Sendable, which produced many confusing errors.

In Xcode 26, the Approachable Concurrency build setting turns on SE-0461 together with related upcoming features (inferring isolated conformances, inferring Sendable for methods and key-path literals, and others), and new app projects also default to MainActor isolation (SE-0466). So in a new project, most code runs on the main actor unless you mark it nonisolated or @concurrent. Always check your target's settings before reasoning about which thread code runs on.`,code:`nonisolated func parse(_ data: Data) async -> Model { ... }      // SE-0461: caller's actor

@concurrent
nonisolated func decodeLarge(_ data: Data) async throws -> [Item] { // always off-actor
  try JSONDecoder().decode([Item].self, from: data)
}

@MainActor func reload() async throws {
  let items = try await decodeLarge(data)   // runs in the thread pool
  self.items = items                        // back on the main actor
}`},{id:`co17`,level:`Intermediate`,q:`Why must you never block inside async code?`,short:`The cooperative pool has about one thread per core; semaphore.wait or Thread.sleep starves it and can deadlock.`,a:`Swift concurrency's cooperative thread pool assumes tasks make forward progress and suspend at await. Blocking calls — DispatchSemaphore.wait for another task, Thread.sleep, synchronous network or file I/O — hold a pool thread, and a few of those can stall or deadlock the whole pool. Use await-based APIs instead: Task.sleep, continuations, actors, AsyncStream. Also, async alone doesn't move work off the main actor — CPU-heavy work in a @MainActor function still blocks the UI.`,code:null}],Combine:[{id:`fw1`,level:`Intermediate`,q:`What is the Combine framework?`,short:`Reactive programming: Publishers emit values, Operators transform, Subscribers receive. Type-safe, first-party.`,a:`Combine (iOS 13+) is Apple's framework for processing values over time declaratively. Three roles:

• Publishers emit values and then, optionally, one completion (.finished or .failure): Just, Future, PassthroughSubject/CurrentValueSubject, @Published properties ($name), URLSession.dataTaskPublisher, NotificationCenter.publisher, Timer.publish.
• Operators transform, filter and combine streams: map, filter, compactMap, removeDuplicates, debounce, throttle, combineLatest, merge, zip, flatMap, switchToLatest, catch, retry, receive(on:).
• Subscribers consume values: sink, assign(to:), or custom ones. Nothing happens until something subscribes; the returned AnyCancellable keeps the subscription alive.

It's strongly typed (Output and Failure types are checked at compile time) and handles backpressure via demand. Compared with RxSwift it has no third-party dependency and integrates with Foundation and (pre-iOS 17) SwiftUI's ObservableObject.

Where it fits today: Combine is stable but Apple's newer APIs favor async/await and Observation. Use Combine where it's strongest — time-based composition of event streams (search-as-you-type, form validation, combining several sources) — and async/await for one-shot work like a single network request.`,code:`URLSession.shared.dataTaskPublisher(for: url)
  .map(\\.data)
  .decode(type: User.self, decoder: JSONDecoder())
  .receive(on: DispatchQueue.main)
  .sink(receiveCompletion: { completion in
          if case .failure(let error) = completion { print(error) }
        },
        receiveValue: { [weak self] in self?.user = $0 })
  .store(in: &cancellables)`},{id:`cb1`,level:`Basic`,q:`What are a Publisher and a Subscriber in Combine?`,short:`Publisher emits values then at most one completion (finished/failure). Subscriber requests demand and receives them.`,a:`A Publisher declares Output and Failure types and emits zero or more values followed by at most one completion (.finished or .failure). Nothing happens until a Subscriber attaches: the publisher hands it a Subscription, the subscriber requests demand, and values start flowing. sink and assign are the built-in subscribers and both request unlimited demand. Operators such as map are themselves publishers that wrap an upstream publisher.`,code:`let cancellable = [1, 2, 3].publisher
  .map { $0 * 10 }
  .sink { print($0) }   // 10, 20, 30`},{id:`cb2`,level:`Intermediate`,q:`Is Future lazy or eager? How do you make it lazy?`,short:`Eager: its closure runs when the Future is created and the result is cached. Wrap it in Deferred to run per subscription.`,a:`Future is eager: its closure runs immediately when the Future is created, not when someone subscribes. It then stores the single result (value or error) and replays it to every subscriber, current and future — it never runs the work again.

Consequences:

• The work runs even if nobody ever subscribes (a request fires during object setup).
• Multiple subscribers share one execution — sometimes exactly what you want (like a cached promise), sometimes not.
• retry() doesn't retry: resubscribing to a failed Future just replays the stored failure.
• Creating the Future inside a function that's called later is fine; storing one in a property means the work runs at init.

To make it lazy (run per subscription), wrap it in Deferred: Deferred calls its closure each time a subscriber attaches, creating a brand-new Future — and new work — for each subscription. That makes retry work as expected and delays the side effect until something actually listens.

A related gotcha: Future's promise must be fulfilled exactly once; additional calls are ignored. When bridging to async code, a Future that starts a Task won't cancel that task on cancellation unless you handle it.`,code:`let eager = Future<Int, Error> { promise in
  print("Started!")                       // prints immediately at creation
  fetchCount { promise($0) }
}

let lazy = Deferred {
  Future<Int, Error> { promise in
    fetchCount { promise($0) }            // runs per subscription
  }
}
.retry(2)                                 // actually re-runs the work`},{id:`cb3`,level:`Basic`,q:`PassthroughSubject vs CurrentValueSubject?`,short:`Passthrough: no stored value, late subscribers miss earlier sends. CurrentValue: holds .value and replays it on subscribe.`,a:`Subjects are publishers you push values into imperatively with send(_:) (and send(completion:)), which makes them the bridge from imperative code (delegate callbacks, button taps) into Combine.

• PassthroughSubject<Output, Failure> stores nothing. A value is delivered to whoever is subscribed at that moment; subscribers that attach later never see it. Use it for events: "button tapped", "item deleted", "show alert".
• CurrentValueSubject<Output, Failure> requires an initial value, always holds the latest one in .value (readable and writable synchronously), and immediately sends the current value to each new subscriber, followed by later changes. Use it for state: the current user, a loading flag, the selected filter.

Both are hot — all subscribers share the same stream — and both stop emitting once they receive a completion. A @Published property behaves much like a CurrentValueSubject (emits the current value on subscribe), except it emits in willSet and never completes (Q102).

Encapsulation tip: keep subjects private and expose them as AnyPublisher via eraseToAnyPublisher(), so only the owner can call send.`,code:`let current = CurrentValueSubject<Int, Never>(0)
current.send(1)
let a = current.sink { print("A", $0) }   // prints "A 1" immediately
print(current.value)                      // 1

let events = PassthroughSubject<String, Never>()
events.send("lost")                       // no subscriber yet → dropped
let b = events.sink { print("B", $0) }
events.send("tap")                        // prints "B tap"`},{id:`cb4`,level:`Intermediate`,q:`How does @Published work, and when exactly does it emit?`,short:`$property emits the current value on subscribe, then each change — during willSet, before the new value is stored.`,a:`@Published wraps a stored property of a class; $property is a Published.Publisher that emits the current value when subscribed and then every new value. It emits in willSet, so reading the property itself inside sink still returns the old value — use the emitted value instead. It never completes and works in any class; inside an ObservableObject it also triggers objectWillChange. With @Observable (iOS 17) you don't use @Published at all.`,code:`final class VM { @Published var query = "" }
let vm = VM()
let c = vm.$query.sink { new in

vm.query = "swift"     // prints: swift (old: "")`},{id:`cb5`,level:`Intermediate`,q:`What is the difference between cold and hot publishers?`,short:`Cold: work starts per subscriber (Just, dataTaskPublisher). Hot: one shared live stream (subjects); late subscribers miss values.`,a:`A cold publisher does its work separately for each subscriber — two sinks on a dataTaskPublisher make two network requests. A hot publisher, such as a subject or NotificationCenter publisher, emits regardless of who listens, so late subscribers only see later values. Use share() (or multicast with a subject) to turn a cold publisher into one shared subscription, e.g. so one request feeds several subscribers.`,code:`let shared = URLSession.shared

  .removeDuplicates()
  .map { [api] in api.search($0) } // AnyPublisher<[Item], Never>
  .switchToLatest()          // cancels stale requests
  .assign(to: &$results)`},{id:`cb7`,level:`Basic`,q:`debounce vs throttle?`,short:`debounce: emit the last value after a quiet period. throttle: at most one value per interval (first or latest).`,a:`debounce waits until the upstream has been silent for the given interval and then emits the most recent value — perfect for search fields. throttle emits at most one value per interval regardless of how fast values arrive; latest: true picks the last value in each window, false the first — good for scroll or sensor events. Both need a scheduler for their timers, usually DispatchQueue.main in UI code. Pair them with removeDuplicates, which only drops consecutive equal values.`,code:`$query
  .debounce(for: .milliseconds(300), scheduler: DispatchQueue.main)
  .removeDuplicates()`},{id:`cb8`,level:`Intermediate`,q:`combineLatest vs zip vs merge?`,short:`combineLatest: latest of each whenever any emits. zip: pairs values by index. merge: interleaves streams of the same type.`,a:`combineLatest emits a tuple of the latest value from each publisher whenever any of them emits (after all have emitted once) — ideal for form validation. zip waits for one new value from each publisher and pairs them in lockstep, e.g. combining two parallel request results. merge interleaves values from publishers with identical Output and Failure types into one stream without pairing them.`,code:`$email.combineLatest($password)
  .map { $0.contains("@") && $1.count >= 8 }
  .assign(to: &$isValid)`},{id:`cb9`,level:`Intermediate`,q:`What happens when a Combine publisher fails, and how do you recover?`,short:`Failure is terminal — the stream ends. Recover with catch, replaceError(with:), or retry (resubscribes upstream).`,a:`A failure completes the stream; no more values arrive. catch replaces the failed publisher with a fallback publisher; replaceError(with:) emits one value and finishes; retry(n) resubscribes upstream. tryMap turns a thrown error into a failure (Failure becomes Error) and mapError converts error types. Put retry before decode so a decoding error doesn't trigger another fetch, and remember that retry on a non-deferred Future just replays the cached failure.`,code:`api.dataPublisher(for: url)
  .retry(2)                       // only network failures retried
  .decode(type: User.self, decoder: JSONDecoder())
  .catch { _ in Just(User.placeholder) }
  .receive(on: DispatchQueue.main)`},{id:`cb10`,level:`Advanced`,q:`subscribe(on:) vs receive(on:)?`,short:`receive(on:) moves downstream delivery (e.g. to main). subscribe(on:) moves subscription, demand and cancel calls upstream.`,a:`receive(on:) changes the scheduler on which downstream operators and the subscriber receive values — typically DispatchQueue.main before UI updates. subscribe(on:) changes where subscription, demand requests and cancellation are performed upstream; it only moves value production for publishers that do their work in response to subscribing, such as a Deferred computation. A subject delivers values on whatever thread calls send(), regardless of subscribe(on:).`,code:`Deferred { Just(expensiveParse(data)) }
  .subscribe(on: DispatchQueue.global())  // parse off main
  .receive(on: DispatchQueue.main)        // deliver on main
  .sink { [weak self] in self?.items = $0 }`},{id:`cb12`,level:`Intermediate`,q:`How do subscriptions stay alive, and how do they leak?`,short:`A subscription lives while its AnyCancellable does. Store it in a Set and use [weak self] to avoid self → set → closure → self.`,a:`sink and assign(to:on:) return an AnyCancellable; when it is deallocated or cancel() is called, the subscription ends. store(in: &cancellables) ties it to the owner's lifetime. If the closure captures self strongly you get a cycle: self owns the set, the set owns the cancellable, the closure owns self — use [weak self]. assign(to:on:) always retains its target strongly; prefer assign(to: &$property) (iOS 14), which returns nothing and lives as long as the @Published property.`,code:`vm.$count
  .sink { [weak self] in self?.label.text = "\\($0)" }
  .store(in: &cancellables)
// .assign(to: \\.title, on: self) would retain self`},{id:`cb13`,level:`Intermediate`,q:`How do Combine and async/await interoperate?`,short:`Publisher to async: for await x in publisher.values. Async to Combine: a Future or Deferred that starts a Task.`,a:`Every publisher exposes .values, an AsyncSequence — use for await, or for try await when Failure isn't Never. .values requests one value at a time, so a hot subject emitting faster than the loop consumes can drop values (add buffer). In the other direction, wrap async work in a Future that starts a Task (cancelling the subscription won't cancel that Task unless you handle it). Use Combine for time-based composition like debounce and combineLatest; async/await for one-shot sequential work.`,code:`for await value in vm.$query.values {
  print(value)
}
// failing publisher: for try await x in pub.values`},{id:`cb14`,level:`Intermediate`,q:`Why use eraseToAnyPublisher()?`,short:`Hides long nested operator types behind AnyPublisher<Output, Failure>, keeping APIs stable and implementations private.`,a:`Every Combine operator returns a new generic type wrapping its upstream: $query.debounce(...).removeDuplicates().map(...) has a type like Publishers.Map<Publishers.RemoveDuplicates<Publishers.Debounce<Published<String>.Publisher, DispatchQueue>>, [Item]>.

Exposing that type in an API has two problems:

1. It leaks implementation details — callers (and your protocol) are tied to the exact operator chain.
2. It's fragile — adding a retry or filter changes the return type and breaks every caller and conforming mock.

eraseToAnyPublisher() wraps the chain in AnyPublisher<Output, Failure>, so the signature only promises *what* is emitted and how it can fail. It's the standard return type for repository and service methods and for protocol requirements, and it lets a test mock return Just(value).setFailureType(to: Error.self).eraseToAnyPublisher() with the same type.

Costs and alternatives: one small indirection per event, negligible in practice. You can also return an opaque type — some Publisher<[Item], Never> — which hides the concrete type while keeping static typing; but a protocol requirement or a property whose implementation varies (live vs mock) still needs AnyPublisher. Similarly, expose subjects as AnyPublisher so callers can't call send on them.`,code:`protocol SearchService {
  func search(_ q: String) -> AnyPublisher<[Item], Never>
}

final class LiveSearch: SearchService {
  private let resultsSubject = PassthroughSubject<[Item], Never>()
  var results: AnyPublisher<[Item], Never> { resultsSubject.eraseToAnyPublisher() } // read-only

  func search(_ q: String) -> AnyPublisher<[Item], Never> {
    client.items(matching: q)
      .replaceError(with: [])
      .eraseToAnyPublisher()
  }
}

struct MockSearch: SearchService {
  func search(_ q: String) -> AnyPublisher<[Item], Never> { Just([.fixture]).eraseToAnyPublisher() }
}`}],Architecture:[{id:`ar1`,level:`Basic`,q:`What is MVVM and why is it preferred over MVC?`,short:`Model-View-ViewModel. ViewModel has no UIKit import — fully unit-testable. No Massive ViewController.`,a:`MVVM splits a screen into three roles:

• Model — domain data and business rules (structs, services, repositories).
• ViewModel — turns model data into view-ready state (formatted strings, isLoading, error messages, enabled/disabled flags) and exposes intents the view calls (load(), didTapSave()). It talks to services, but has no UIKit/SwiftUI view references.
• View (a SwiftUI view, or a UIViewController + views in UIKit) — renders the ViewModel's state and forwards user actions. It never touches the model or services directly.

Binding the view to the ViewModel uses @Observable/ObservableObject in SwiftUI, or Combine, closures or delegate callbacks in UIKit.

Why teams prefer it over Apple-style MVC:

• Testability — presentation logic lives in a plain class you can unit test without a simulator.
• Smaller view controllers — the VC shrinks to lifecycle and layout.
• Clear state — modelling a screen as a state value (enum ViewState { case loading, loaded([Item]), failed(String) }) prevents impossible combinations.

Weak spots to mention: ViewModels can become "massive" too, navigation doesn't belong in them (use a coordinator/router), and in SwiftUI a ViewModel that only forwards calls adds little (Q121).`,code:`@MainActor @Observable
final class ProductsViewModel {
  enum State { case loading, loaded([Product]), failed(String) }
  private(set) var state: State = .loading
  private let repository: ProductRepository

  init(repository: ProductRepository) { self.repository = repository }

  func load() async {
    do { state = .loaded(try await repository.products()) }
    catch { state = .failed("Couldn't load products.") }
  }
}`},{id:`ar2`,level:`Basic`,q:`What is MVC and what is its main problem in iOS?`,short:`Model-View-Controller. UIViewController becomes Massive View Controller — too many responsibilities.`,a:`MVC is Apple's classic UIKit pattern:

• Model — data and business logic.
• View — UI elements (UIView, cells, storyboards) that display data and send user actions.
• Controller — mediates: updates views from the model and updates the model from user actions.

The problem in iOS is that UIViewController is tightly coupled to its view — it owns the view's lifecycle (viewDidLoad, viewWillAppear), layout and rotation, so View and Controller merge into one class. Then everything else lands there too: networking, JSON parsing, validation, formatting, table view data source and delegate, navigation, analytics. The result is the Massive View Controller: thousands of lines, many reasons to change, and logic that can't be unit-tested without instantiating UIKit.

How to fix it without abandoning UIKit:

• move networking and persistence into services/repositories,
• move presentation logic into a ViewModel or presenter (MVVM/MVP),
• move navigation into coordinators,
• split large screens into child view controllers,
• move data source/delegate code into separate objects, or use diffable data sources and cell configurations,
• move business rules into use cases (Clean Architecture).

MVC is still fine for small screens — the problem is putting everything in one place, not the pattern itself.`,code:null},{id:`ar3`,level:`Basic`,q:`What is the Singleton pattern? What are its drawbacks?`,short:`One shared global instance. Drawbacks: hidden dependencies, global mutable state, untestable in isolation.`,a:`The Singleton pattern guarantees a single shared instance accessed globally — in Swift: static let shared = Thing() with a private init() (the static let is lazily initialized and thread-safe). Apple uses it for resources that genuinely exist once per process: URLSession.shared, UserDefaults.standard, FileManager.default, NotificationCenter.default, UIApplication.shared.

Drawbacks:

• Hidden dependencies — a type calling Analytics.shared inside a method doesn't declare that dependency, so you can't tell what it needs from its API.
• Global mutable state — any code can change it, so bugs become order-dependent and hard to trace; with concurrency it also needs synchronization (in Swift 6, a non-Sendable global is a compile error).
• Testing — tests share state and can't substitute a fake easily, so they become slow, flaky or order-dependent.
• Lifetime — it lives forever; resetting it on logout is awkward.

Balanced answer: the shared *instance* isn't the problem; *reaching for it from everywhere* is. Create one instance, but inject it behind a protocol (constructor injection with a default value is a pragmatic middle ground), so production gets the shared object and tests get a mock.`,code:`protocol Analytics { func track(_ event: String) }

final class FirebaseAnalytics: Analytics {
  static let shared = FirebaseAnalytics()    // still one instance
  private init() {}
  func track(_ event: String) { /* ... */ }
}

final class CheckoutViewModel {
  private let analytics: Analytics           // injected, not looked up
  init(analytics: Analytics = FirebaseAnalytics.shared) { self.analytics = analytics }
}
// Test: CheckoutViewModel(analytics: SpyAnalytics())`},{id:`ar4`,level:`Basic`,q:`What is the Delegation pattern? Why is the delegate weak?`,short:`Object delegates responsibilities via a protocol. Delegate is weak to prevent retain cycles between delegator and owner.`,a:`Delegation lets one object (the delegator — a table view, a text field, a custom picker) hand some decisions or event handling to another object (the delegate) through a protocol. The delegator stays generic and reusable; it only knows "something conforming to this protocol". Delegate methods often pass the delegator as the first argument (tableView(_:didSelectRowAt:)) so one delegate can serve several instances, and some return values to influence behavior (textFieldShouldReturn → Bool).

Why weak: in the usual ownership graph the delegate owns the delegator — a view controller holds its table view (through its view) or a service it created. If the delegator also held the delegate strongly, you'd have VC → tableView → VC, a retain cycle, and the screen would never be deallocated. A weak reference expresses "I talk to you, but I don't keep you alive".

Requirements: weak works only with class types, so the protocol must be class-constrained with AnyObject (protocol FetchDelegate: AnyObject). The property must be an optional var, and callers use optional chaining, which also handles "no delegate set". Exception: some APIs intentionally retain their delegate — URLSession keeps a strong reference to its delegate until the session is invalidated — so read the docs.`,code:`protocol FetcherDelegate: AnyObject {               // AnyObject allows weak
  func fetcher(_ fetcher: Fetcher, didFetch data: Data)
  func fetcher(_ fetcher: Fetcher, didFail error: Error)
}

final class Fetcher {
  weak var delegate: FetcherDelegate?               // no retain cycle
  func finish(_ data: Data) { delegate?.fetcher(self, didFetch: data) }
}

final class ListViewController: UIViewController, FetcherDelegate {
  private let fetcher = Fetcher()                   // VC owns fetcher
  override func viewDidLoad() { super.viewDidLoad(); fetcher.delegate = self }
  func fetcher(_ f: Fetcher, didFetch data: Data) { /* update UI */ }
  func fetcher(_ f: Fetcher, didFail error: Error) { /* show error */ }
}`},{id:`ar5`,level:`Basic`,q:`What is the Observer pattern and how is it implemented in iOS?`,short:`Subject notifies registered observers when state changes without knowing who observes it.`,a:`The Observer pattern defines a one-to-many dependency: a subject keeps a list of observers and notifies them when its state changes, without knowing what they are. It decouples the producer of changes from the code that reacts to them.

iOS implementations, from oldest to newest:

• NotificationCenter — broadcast by name; any number of observers anywhere in the app; very loose coupling but untyped (userInfo dictionary) and hard to trace (Q120).
• Key-Value Observing (KVO) — observe a property of an NSObject subclass; the property must be @objc dynamic. Swift's block API observe(\\.keyPath) returns an NSKeyValueObservation token that stops observing when deallocated. Still used for system objects (AVPlayer.status, WKWebView.estimatedProgress).
• Delegates/closures — one-to-one variants of the same idea.
• Combine — @Published properties and subjects are typed publishers; subscribers get values and completion, with operators for transformation (Q98).
• Observation framework (@Observable, iOS 17) — property-level change tracking used by SwiftUI and (iOS 26) UIKit; withObservationTracking lets non-UI code observe a change.

Things to discuss: avoiding leaks (observers holding the subject or self strongly), removing or cancelling observations, and which thread notifications arrive on.`,code:`// KVO on a system object
var observation: NSKeyValueObservation?
observation = player.observe(\\.status, options: [.new]) { player, _ in
  print("Status:", player.status.rawValue)
}   // set observation = nil to stop

// Combine
final class Cart { @Published var items: [Item] = [] }
let cancellable = cart.$items.sink { print("Count:", $0.count) }`},{id:`ar6`,level:`Intermediate`,q:`What is the Factory pattern? Give an iOS example.`,short:`Centralizes object creation behind a method. Decouples creation from usage. dequeueReusableCell is a classic factory.`,a:`The Factory pattern moves object creation behind a method or object, so callers ask for "a thing" without knowing the concrete type or how to build it. Variants:

• Factory method — a function or static method that decides which concrete type to return (PaymentMethodFactory.make(for: .applePay)), often returning a protocol type.
• Abstract factory — an object that creates families of related objects (ThemeFactory producing buttons and labels for light or premium themes).

Benefits: callers depend on abstractions, creation logic (configuration, dependencies, choosing a subclass) lives in one place, and tests can supply a factory that produces mocks.

iOS examples:

• dequeueReusableCell(withIdentifier:for:) — you request a cell by identifier; the table view decides whether to create a new one or reuse one from its queue.
• UIButton(configuration:) and UIFont.preferredFont(forTextStyle:) return objects configured for you.
• In app code, a screen factory used by coordinators: it builds a view controller with its view model and injected services, so the coordinator doesn't know the dependency graph.`,code:`protocol ScreenFactory {
  func makeProductList(onSelect: @escaping (Product) -> Void) -> UIViewController
  func makeProductDetail(_ product: Product) -> UIViewController
}

struct LiveScreenFactory: ScreenFactory {
  let api: APIClient
  func makeProductList(onSelect: @escaping (Product) -> Void) -> UIViewController {
    let vm = ProductListViewModel(repository: ProductRepository(api: api), onSelect: onSelect)
    return ProductListViewController(viewModel: vm)
  }
  func makeProductDetail(_ product: Product) -> UIViewController {
    ProductDetailViewController(viewModel: .init(product: product, api: api))
  }
}`},{id:`ar7`,level:`Intermediate`,q:`What is the Facade pattern?`,short:`Provides a simple unified interface to a complex subsystem. Hides internal coordination from callers.`,a:`The Facade pattern puts a simple, high-level interface in front of a complex subsystem. Callers talk to one object with intention-revealing methods; the facade coordinates the many lower-level objects inside.

iOS example: a NetworkService facade exposing fetchUser(id:). Internally it builds the URLRequest, adds headers and the auth token, refreshes the token on 401, retries transient failures, checks the status code, decodes JSON with the configured decoder, maps errors to app-level errors, and logs. The view model calls one method and knows none of that. Other common facades: a MediaPlayer wrapping AVFoundation's player, item, audio session and observers; a PaymentService wrapping StoreKit; an AnalyticsService hiding several SDKs.

Benefits: callers are simpler and decoupled from the subsystem, you can change internals (Alamofire → URLSession) without touching callers, and the facade's protocol is an easy seam for mocking. Risks: a facade that keeps growing becomes a God object — keep it focused on one subsystem, and let advanced callers use lower-level APIs when needed.

Difference from similar patterns: an Adapter converts one interface into another expected interface; a Facade simplifies a whole subsystem.`,code:`final class NetworkService {
  private let session: URLSession
  private let auth: AuthManager
  private let decoder: JSONDecoder

  init(session: URLSession, auth: AuthManager, decoder: JSONDecoder) {
    self.session = session; self.auth = auth; self.decoder = decoder
  }

  func fetchUser(id: Int) async throws -> User {    // one simple call for callers
    var request = URLRequest(url: Endpoint.user(id).url)
    request.setValue("Bearer \\(try await auth.validToken())", forHTTPHeaderField: "Authorization")
    let (data, response) = try await session.data(for: request)
    guard (response as? HTTPURLResponse)?.statusCode == 200 else { throw APIError.badStatus }
    return try decoder.decode(User.self, from: data)
  }
}`},{id:`ar8`,level:`Intermediate`,q:`What is an anti-pattern? Give iOS examples.`,short:`Common solution that creates more problems than it solves. iOS: Massive VC, God Object, Singleton overuse.`,a:`An anti-pattern is a solution that looks reasonable and is commonly used, but reliably creates more problems than it solves — usually showing up later as bugs, slow changes or untestable code. Knowing them helps you explain *why* a design is bad, not just that it is.

iOS examples:

• Massive View Controller — networking, parsing, formatting, navigation and business logic all in one UIViewController.
• God object / God service — one AppManager or Utils class that knows everything and that every file imports.
• Singleton overuse — global mutable state accessed from everywhere, hiding dependencies and breaking tests (Q114).
• Prop drilling — passing data through many intermediate views that don't use it, instead of DI or the environment.
• Stringly-typed code — notification names, segue identifiers, userInfo keys and JSON keys as raw strings scattered around.
• Force unwrapping and try! everywhere — turning recoverable conditions into crashes.
• Copy-paste programming and "boolean soup" state (isLoading, hasError, isEmpty that can contradict each other) instead of an enum state.
• Premature abstraction — protocols with one implementation and layers that just forward calls.

In an interview, pair each with the remedy you'd apply (extract services, inject dependencies, model state as an enum, use typed constants).`,code:null},{id:`fw4`,level:`Basic`,q:`What is NotificationCenter and when should you use it?`,short:`Broadcast messaging. Post named notifications; any observer receives without knowing the sender.`,a:`NotificationCenter provides one-to-many broadcast communication: a poster calls post(name:object:userInfo:) and every registered observer receives it, without either knowing the other. Use it for system events (keyboard, app lifecycle) and loosely coupled cross-module messages. Drawbacks: untyped userInfo and hidden control flow. With the block-based API, keep the returned token and pass it to removeObserver(_:) when done; selector-based observers are removed automatically since iOS 9.`,code:`NotificationCenter.default.addObserver(
  forName: UIResponder.keyboardWillShowNotification,
  object: nil, queue: .main) { [weak self] n in
  self?.adjustForKeyboard(n)
